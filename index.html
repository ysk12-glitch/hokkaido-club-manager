<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>札幌ノルディアFC</title><style>*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:#06131e;color:#eef7fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#0b2435,#06131e)}header{padding:12px 14px 7px;background:#0b2639}h1{font-size:19px;margin:0}.sub,.meta{font-size:10px;color:#9eb8c8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}.stat,.card{background:#102b3e;border:1px solid #28516a;border-radius:14px;padding:11px}.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:#91b2c7}.hero{margin:0 8px 9px;padding:12px;border-radius:17px;background:linear-gradient(135deg,#17465e,#175b43)}.hero h2{margin:0;font-size:20px}main{padding:0 7px 100px}.section{display:none}.section.on{display:block}.action,.mini{border:0;border-radius:10px;padding:9px;background:#2f9669;color:#fff;font-weight:800}.mini{padding:7px}.secondary{background:#29495e}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;background:#0b2233f2;padding:6px 5px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);z-index:20}.bottom button{border:0;background:none;color:#9fb7c7;font-size:9px;padding:5px 0}.bottom b{display:block;font-size:18px}.bottom .on{color:#6be0a3}.strength{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.num{font-size:32px;font-weight:900}.good{color:#6bdfa5}.formation,.modes,.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0}.formation .on{background:#2f9669}.board{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:5px;margin-top:7px;height:555px}.pitch{position:relative;background:repeating-linear-gradient(0deg,#17613f 0 56px,#155a3b 56px 112px);border:2px solid #d9f0df99;border-radius:15px;overflow:hidden}.pitch:before{content:'';position:absolute;inset:7px;border:1px solid #fff7}.pitch:after{content:'';position:absolute;left:7px;right:7px;top:50%;border-top:1px solid #fff7}.attack{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:9px;color:#d9f0dfaa}.slot{position:absolute;transform:translate(-50%,-50%);width:56px;height:55px;border-radius:9px;border:1px dashed #ffffff44;display:grid;place-items:center;z-index:2}.slot.target{border:2px solid #fff;background:#ffffff22}.token{width:52px;min-height:50px;border-radius:9px;padding:3px 2px;text-align:center;color:#fff;box-shadow:0 2px 6px #0007;user-select:none;position:relative}.token.selected{outline:4px solid #fff;transform:scale(1.06);z-index:5}.token b{font-size:14px;display:block}.token small{font-size:7px;line-height:1.05;display:block}.gk{background:#c74444}.df{background:#2473c5}.mf{background:#d3a51c;color:#14202b}.fw{background:#26945d}.side{display:grid;grid-template-rows:1fr 1fr;gap:5px;min-height:0}.pool{background:#102b3e;border:1px solid #28516a;border-radius:12px;padding:4px;overflow:auto}.pool h4{font-size:9px;margin:1px 0 4px;text-align:center;color:#a9c2d1}.pool .token{width:100%;min-height:42px;margin-bottom:4px}.hint,.moveMsg{text-align:center;font-size:10px;color:#9eb8c8;margin:5px 0;min-height:14px}.table{width:100%;border-collapse:collapse;font-size:10px}.table td,.table th{padding:6px 3px;border-bottom:1px solid #24465a}.me{color:#6bdfa5;font-weight:900}.rival{color:#ffc461}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}.playerrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #28475a}.modal{display:none;position:fixed;inset:0;background:#020a10f5;z-index:50;padding:18px 10px;overflow:auto}.modal.on{display:block}.profile{max-width:680px;margin:auto} .slot{width:23%;height:8%;min-height:34px;border-radius:7px}.slot.ready{border-color:#c6ffca}.slot .token{width:100%;min-height:100%;height:100%;padding:2px 0}.slot .token b{font-size:12px}.slot .token small{font-size:7px}.slot .empty{font-size:8px;color:#c8e4d4;text-align:center}.slot .fit{position:absolute;top:-5px;right:-3px;border-radius:9px;background:#06131e;color:#fff;font-size:10px;padding:0 3px}.board{height:590px}.pitch{overflow:hidden}.pool{cursor:pointer}.pool h4{position:sticky;top:0;background:#102b3e;z-index:3}.trainingRow{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.trainingRow select{min-width:0;flex:1;background:#19384b;color:white;border:1px solid #45687d;border-radius:8px;padding:8px;font-size:12px}</style></head><body><div class="app"><header><h1>⚽ 北海道クラブマネージャー</h1><div class="sub">CLUB LEGACY · v0.8.1</div></header><div class="stats"><div class="stat"><span>資金</span><b id="money"></b></div><div class="stat"><span>サポーター</span><b id="fans"></b></div><div class="stat"><span>シーズン</span><b id="season"></b></div></div><div class="hero"><h2>札幌ノルディアFC</h2><div id="heroText" class="meta"></div></div><main><section id="home" class="section on"></section><section id="players" class="section"></section><section id="league" class="section"></section><section id="town" class="section"></section><section id="scout" class="section"></section><section id="more" class="section"></section></main><nav class="bottom" id="bottom"></nav></div><div class="modal" id="modal"><div class="profile" id="profile"></div></div><script>const KEY='hcm-v02',MY='札幌ノルディアFC',RIVAL='旭川ヴァルク',schedule=['青森ブリザード','千葉オルカ',RIVAL,'仙台レグルス','横浜セイラーズ','新潟アルビオン','東京クロノス','鹿児島サザンクロス','名古屋グランツ','福岡アトラス','神戸ハーバーズ','広島レッドアロー','大阪フェニックス'];const navs=[['home','🏠','ホーム'],['players','👥','編成'],['league','🏆','リーグ'],['town','🏙️','街'],['scout','🔎','移籍'],['more','☰','その他']];let g=JSON.parse(localStorage.getItem(KEY)||'null'),picked=null,subtab='squad';const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));if(!g){alert('セーブデータがありません');throw 0}function band(p){if(p==='GK')return'gk';if(['CB','SB','LB','RB','LWB','RWB'].includes(p))return'df';if(['CF','ST','LW','RW','LWG','RWG'].includes(p))return'fw';return'mf'}const POS={'4-3-3':[16,17,18,19,9,10,11,1,2,3,14],'4-4-2':[16,17,18,19,8,9,10,11,2,3,14],'3-4-2-1':[16,17,18,8,9,10,11,4,6,2,14]};
const GRID=Array.from({length:20},(_,i)=>({x:[13,38,63,88][i%4],y:[15,34,52,72,91][Math.floor(i/4)]}));
const expected=i=>i<4?'fw':i<12?'mf':i<16?'df':'gk';
function fit(p,i){let a=band(p.pos),b=expected(i),xp=(p.positionXP||{})[b]||0;return a===b||xp>=12?'◎':xp>=5||(a==='mf'&&(b==='fw'||b==='df'))||(a==='fw'&&b==='mf')||(a==='df'&&b==='mf')?'○':'△'}
function preset(f){let old=g.lineup.filter(Boolean),used=new Set(),slots=Array(20).fill(null);for(const i of POS[f]){let best=old.filter(id=>!used.has(id)).map(id=>player(id)).filter(Boolean).sort((a,b)=>(band(b.pos)===expected(i)?1000:0)+b.ovr-((band(a.pos)===expected(i)?1000:0)+a.ovr))[0];if(best){slots[i]=best.id;used.add(best.id)}}g.lineup=slots;syncRoles()}
function hydrate(){g.formation=g.formation||'4-3-3';g.players.forEach((p,i)=>{p.positionXP=p.positionXP||{};p.role=p.role||(p.starter?'starter':i<18?'bench':'out');p.age=p.age||r(18,32);p.salary=p.salary||Math.max(500,Math.round(p.ovr*p.ovr*1.8));p.contract=p.contract||r(1,4);p.value=p.value||Math.round(p.ovr*p.ovr*12);p.mood=p.mood||r(70,98)});if(!g.lineup||!Array.isArray(g.lineup))migrateLineup();if(g.lineup.length===11){let prev=g.lineup.slice(),next=Array(20).fill(null);POS[g.formation].forEach((i,j)=>next[i]=prev[j]||null);g.lineup=next}if(g.lineup.length!==20)migrateLineup();syncRoles()}function migrateLineup(){let old=g.players.filter(p=>p.role==='starter').slice(0,11),used=new Set();g.lineup=Array(20).fill(null);for(let i of POS[g.formation]){let p=old.filter(x=>!used.has(x.id)).sort((a,b)=>(band(b.pos)===expected(i)?1000:0)+b.ovr-((band(a.pos)===expected(i)?1000:0)+a.ovr))[0];if(p){g.lineup[i]=p.id;used.add(p.id)}}}
function syncRoles(){let ids=new Set(g.lineup.filter(Boolean));g.players.forEach(p=>{if(ids.has(p.id))p.role='starter';else if(p.role==='starter')p.role='bench';p.starter=p.role==='starter'})}hydrate();const save=()=>localStorage.setItem(KEY,JSON.stringify(g)),yen=n=>n>=1e8?(n/1e8).toFixed(1)+'億':Math.floor(n/1e4)+'万',opp=()=>schedule[(g.week-1)%schedule.length],row=n=>g.table.find(x=>x.n===n),player=id=>g.players.find(p=>p.id===id),starters=()=>g.lineup.map(player).filter(Boolean);function teamPower(){let total=g.lineup.reduce((sum,id,i)=>{let p=player(id);return sum+(p?p.ovr*(fit(p,i)==='◎'?1:fit(p,i)==='○'?.93:.75):0)},0);return Math.round(total/11)}function oppPower(n){return Math.round(row(n)?.power||65)}function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('on',x.id===id));picked=null;render();scrollTo(0,0)}function render(){money.textContent=yen(g.money)+'円';fans.textContent=(g.fans||0).toLocaleString()+'人';season.textContent=`S${g.season} W${g.week}`;let me=row(MY)||{w:0,d:0,l:0},o=opp();heroText.textContent=`${me.w}勝 ${me.d}分 ${me.l}敗 ｜ チーム力 ${teamPower()} ｜ ${g.formation}`;bottom.innerHTML=navs.map(x=>`<button class="${document.getElementById(x[0]).classList.contains('on')?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');home.innerHTML=`<div class="card"><div class="strength"><div><b>${MY}</b><div class="num good">${teamPower()}</div></div><b>VS</b><div><b>${o}</b><div class="num">${oppPower(o)}</div></div></div><div class="modes"><button class="action" onclick="quickMatch()">⏭ スキップ</button><button class="action secondary" onclick="alert('視聴モードは試合エンジン改修中')">👀 視聴</button><button class="action secondary" onclick="alert('プレイモードは試合エンジンを作り直し中')">🎮 プレイ</button></div></div><h3>クラブニュース</h3><div class="card">${(g.logs||[]).slice(-6).reverse().join('<br>')}</div>`;players.innerHTML=squadHTML();league.innerHTML=leagueHTML();town.innerHTML=`<h3>クラブ経営</h3><div class="card">年間人件費 <b>${yen(g.players.reduce((a,p)=>a+(p.salary||0)*10000,0))}</b></div>`;scout.innerHTML=`<h3>移籍市場</h3><div class="card">移籍・契約システムは次段階で再接続します。</div>`;more.innerHTML=`<h3>その他</h3><div class="card"><b>開発者メニュー</b><div class="controls"><button class="mini" onclick="cash(1e8)">+1億</button><button class="mini" onclick="cash(1e9)">+10億</button><button class="mini" onclick="cash(1e10)">+100億</button></div></div>`}function setFormation(f){if(f===g.formation)return;if(confirm('選手を新しいフォーメーションに自動配置しますか？\nキャンセルすると配置はそのままで表示だけ変更します。'))preset(f);g.formation=f;picked=null;save();render()}function squadHTML(){return`<h3>チーム編成</h3><div class="formation">${Object.keys(POS).map(f=>`<button class="mini secondary ${g.formation===f?'on':''}" onclick="setFormation('${f}')">${f}</button>`).join('')}</div><div class="card"><div class="strength"><div><span class="meta">チーム総合</span><div class="num good">${teamPower()}</div></div><div>⚽</div><div><span class="meta">次節相手</span><div class="num">${oppPower(opp())}</div></div></div></div><div class="hint">①選手を選択 → ②20枠の好きな場所をタップ（既存選手とは交換）</div><div class="moveMsg">${picked?`選択中：${player(picked)?.n||''}`:'◎本職 ○対応可能 △不慣れ　空き枠にも配置できます'}</div>${boardHTML()}<div class="card" style="margin-top:10px"><b>🏋️ 個人トレーニング</b><p class="meta">12回練習で新しいポジションも◎に育ちます。</p><div class="trainingRow"><select id="trainPlayer">${g.players.map(p=>`<option value="${p.id}">${p.n}（${p.ovr}）</option>`).join('')}</select><select id="trainPos"><option value="gk">GK</option><option value="df">DF</option><option value="mf">MF</option><option value="fw">FW</option></select><button class="mini" onclick="trainPosition()">練習</button></div><p id="trainResult" class="meta"></p></div>`}function trainPosition(){let el=document.getElementById('trainPlayer'),sel=document.getElementById('trainPos');if(!el||!sel)return;let id=Number(el.value),b=sel.value,p=player(id);if(!p)return;p.positionXP=p.positionXP||{};p.positionXP[b]=(p.positionXP[b]||0)+1;p.ovr++;save();render();document.getElementById('trainPlayer').value=id;document.getElementById('trainPos').value=b;document.getElementById('trainResult').textContent=p.n+'：'+b.toUpperCase()+'経験 '+p.positionXP[b]+'/12、OVR +1'} function token(p,where){return`<div class="token ${band(p.pos)} ${picked===p.id?'selected':''}" onclick="playerTap(event,${p.id},'${where}')"><b>${p.ovr}</b><small>${p.n.split(' ')[0]}</small><small>${p.pos}</small></div>`}function boardHTML(){let bench=g.players.filter(p=>p.role==='bench'),out=g.players.filter(p=>p.role==='out');return `<div class="board"><div class="pitch"><div class="attack">▲ ATTACK</div>${g.lineup.map((id,i)=>`<div class="slot ${picked?'ready':''}" style="left:${GRID[i].x}%;top:${GRID[i].y}%" onclick="slotTap(event,${i})">${id?token(player(id),'slot:'+i):`<small class="empty">${['FW','MF前','MF後','DF','GK'][Math.floor(i/4)]}<br>＋</small>`}${id?`<span class="fit">${fit(player(id),i)}</span>`:''}</div>`).join('')}</div><div class="side"><div class="pool" onclick="poolTap(event,'bench')"><h4>BENCH ＋</h4>${bench.map(p=>token(p,'bench')).join('')}</div><div class="pool" onclick="poolTap(event,'out')"><h4>OUT ＋</h4>${out.map(p=>token(p,'out')).join('')}</div></div></div>`}
function poolTap(e,role){e.stopPropagation();if(picked==null)return;let a=locate(picked),p=player(picked);if(a.type==='slot')g.lineup[a.i]=null;p.role=role;picked=null;syncRoles();save();render()}
function locate(id){let i=g.lineup.indexOf(id);if(i>=0)return{type:'slot',i};let p=player(id);return{type:p?.role||'out'}}function playerTap(e,id,where){e.stopPropagation();if(picked==null){picked=id;render();return}if(picked===id){picked=null;render();return}swapPlayers(picked,id)}function slotTap(e,i){e.stopPropagation();if(!picked)return;let target=g.lineup[i];if(target)swapPlayers(picked,target);else moveToEmpty(picked,i)}function swapPlayers(aid,bid){let a=locate(aid),b=locate(bid),pa=player(aid),pb=player(bid);if(a.type==='slot'&&b.type==='slot'){[g.lineup[a.i],g.lineup[b.i]]=[g.lineup[b.i],g.lineup[a.i]]}else if(a.type==='slot'){g.lineup[a.i]=bid;pb.role='starter';pa.role=b.type}else if(b.type==='slot'){g.lineup[b.i]=aid;pa.role='starter';pb.role=a.type}else{let ar=pa.role;pa.role=pb.role;pb.role=ar}picked=null;syncRoles();save();render()}function moveToEmpty(id,i){let a=locate(id),p=player(id);if(a.type==='slot')g.lineup[a.i]=null;g.lineup[i]=id;p.role='starter';picked=null;syncRoles();save();render()}function leagueHTML(){let q=[...(g.table||[])].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));return`<h3>全国リーグ</h3><div class="card"><table class="table"><tr><th>#</th><th>クラブ</th><th>力</th><th>試</th><th>点</th></tr>${q.map((t,i)=>`<tr class="${t.n===MY?'me':t.n===RIVAL?'rival':''}"><td>${i+1}</td><td>${t.n}</td><td>${t.n===MY?teamPower():Math.round(t.power||65)}</td><td>${t.p}</td><td>${t.pts}</td></tr>`).join('')}</table></div>`}function result(t,a,b){if(!t)return;t.p++;t.gf+=a;t.ga+=b;if(a>b){t.w++;t.pts+=3}else if(a===b){t.d++;t.pts++}else t.l++}function quickMatch(){let o=opp(),edge=(teamPower()-oppPower(o))/18,a=Math.max(0,r(0,3)+Math.round(Math.max(0,edge)*Math.random())),b=Math.max(0,r(0,3)+Math.round(Math.max(0,-edge)*Math.random()));result(row(MY),a,b);result(row(o),b,a);g.logs=g.logs||[];g.logs.push(`${o}戦 ${a}-${b}`);g.week++;save();render()}function cash(n){g.money+=n;save();render()}render();</script></body></html>
