function locate(id){let i=g.lineup.indexOf(id);if(i>=0)return{type:'slot',i};let p=player(id);return{type:p?.role||'out'}}function playerTap(e,id,where){e.stopPropagation();if(picked==null){picked=id;render();return}if(picked===id){openPlayer(id);return}swapPlayers(picked,id)}function slotTap(e,i){e.stopPropagation();if(!picked)return;let target=g.lineup[i];if(target)swapPlayers(picked,target);else moveToEmpty(picked,i)}function swapPlayers(aid,bid){let a=locate(aid),b=locate(bid),pa=player(aid),pb=player(bid);if(a.type==='slot'&&b.type==='slot'){[g.lineup[a.i],g.lineup[b.i]]=[g.lineup[b.i],g.lineup[a.i]]}else if(a.type==='slot'){g.lineup[a.i]=bid;pb.role='starter';pa.role=b.type}else if(b.type==='slot'){g.lineup[b.i]=aid;pa.role='starter';pb.role=a.type}else{let ar=pa.role;pa.role=pb.role;pb.role=ar}picked=null;syncRoles();save();render()}function moveToEmpty(id,i){let a=locate(id),p=player(id);if(a.type==='slot')g.lineup[a.i]=null;g.lineup[i]=id;p.role='starter';picked=null;syncRoles();save();render()}function leagueHTML(){let q=[...(g.table||[])].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));return`<h3>全国リーグ</h3><div class="card"><table class="table"><tr><th>#</th><th>クラブ</th><th>力</th><th>試</th><th>点</th></tr>${q.map((t,i)=>`<tr class="${t.n===MY?'me':t.n===RIVAL?'rival':''}"><td>${i+1}</td><td>${t.n}</td><td>${t.n===MY?teamPower():Math.round(t.power||65)}</td><td>${t.p}</td><td>${t.pts}</td></tr>`).join('')}</table></div>`}function result(t,a,b){if(!t)return;t.p++;t.gf+=a;t.ga+=b;if(a>b){t.w++;t.pts+=3}else if(a===b){t.d++;t.pts++}else t.l++}function quickMatch(){let issues=lineupWarnings().filter(x=>x.includes('GK')||x.includes('スタメン'));if(issues.length&&!confirm('編成に問題があります：'+issues.join(' ／ ')+'。このまま試合を進めますか？'))return;let o=opp(),edge=(teamPower()+starters().reduce((n,p)=>n+skillBonus(p),0)/11-oppPower(o))/18,a=Math.max(0,r(0,3)+Math.round(Math.max(0,edge)*Math.random())),b=Math.max(0,r(0,3)+Math.round(Math.max(0,-edge)*Math.random()));result(row(MY),a,b);result(row(o),b,a);g.logs=g.logs||[];g.logs.push(`${o}戦 ${a}-${b}`);g.week++;save();render()}function cash(n){g.money+=n;save();render()}render();</script></body></html>
