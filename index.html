<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>札幌ノルディアFC</title><style>*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:#06131e;color:#eef7fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#0b2435,#06131e)}header{padding:12px 14px 7px;background:#0b2639}h1{font-size:19px;margin:0}.sub,.meta{font-size:10px;color:#9eb8c8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}.stat,.card{background:#102b3e;border:1px solid #28516a;border-radius:14px;padding:11px}.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:#91b2c7}.hero{margin:0 8px 9px;padding:12px;border-radius:17px;background:linear-gradient(135deg,#17465e,#175b43)}.hero h2{margin:0 0 2px;font-size:20px}main{padding:0 7px 100px}.section{display:none}.section.on{display:block}.action,.mini{border:0;border-radius:10px;padding:9px;background:#2f9669;color:white;font-weight:800}.mini{padding:7px}.secondary{background:#29495e}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;background:#0b2233f2;padding:6px 5px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);z-index:20}.bottom button{border:0;background:none;color:#9fb7c7;font-size:9px;padding:5px 0}.bottom b{display:block;font-size:18px}.bottom .on{color:#6be0a3}.strength{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.num{font-size:32px;font-weight:900}.good{color:#6bdfa5}.formation,.modes,.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0}.formation .on{background:#2f9669}.board{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:5px;margin-top:7px;height:555px}.pitch{position:relative;background:repeating-linear-gradient(0deg,#17613f 0 56px,#155a3b 56px 112px);border:2px solid #d9f0df99;border-radius:15px;overflow:hidden}.pitch:before{content:'';position:absolute;inset:7px;border:1px solid #fff7}.pitch:after{content:'';position:absolute;left:7px;right:7px;top:50%;border-top:1px solid #fff7}.attack{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:9px;color:#d9f0dfaa}.slot{position:absolute;transform:translate(-50%,-50%);width:56px;height:55px;border-radius:9px;border:1px dashed #ffffff44;display:grid;place-items:center;z-index:2}.token{width:52px;min-height:50px;border-radius:9px;padding:3px 2px;text-align:center;color:#fff;box-shadow:0 2px 6px #0007;user-select:none}.token.selected{outline:4px solid #fff;transform:scale(1.06)}.token b{font-size:14px;display:block}.token small{font-size:7px;line-height:1.05;display:block}.gk{background:#c74444}.df{background:#2473c5}.mf{background:#d3a51c;color:#14202b}.fw{background:#26945d}.side{display:grid;grid-template-rows:1fr 1fr;gap:5px;min-height:0}.pool{background:#102b3e;border:1px solid #28516a;border-radius:12px;padding:4px;overflow:auto}.pool h4{font-size:9px;margin:1px 0 4px;text-align:center;color:#a9c2d1}.pool .token{width:100%;min-height:42px;margin-bottom:4px}.hint,.moveMsg{text-align:center;font-size:10px;color:#9eb8c8;margin:5px 0;min-height:14px}.table{width:100%;border-collapse:collapse;font-size:10px}.table td,.table th{padding:6px 3px;border-bottom:1px solid #24465a}.me{color:#6bdfa5;font-weight:900}.rival{color:#ffc461}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}.tabs button.on{background:#2f9669}.playerrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #28475a}.tag{font-size:9px;padding:3px 6px;border-radius:10px;background:#27495d}.offer{border-left:3px solid #6bdfa5;margin:7px 0}.modal{display:none;position:fixed;inset:0;background:#020a10f5;z-index:50;padding:18px 10px;overflow:auto}.modal.on{display:block}.profile{max-width:680px;margin:auto}.playbox{position:fixed;inset:0;background:#06131e;z-index:100;display:none}.playbox.on{display:block}.gamebar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:5px 12px;background:#081722;font-weight:800}.field{position:absolute;left:0;right:0;top:48px;bottom:0;background:#187044;overflow:hidden;touch-action:none}.field:before{content:'';position:absolute;inset:10px;border:2px solid #ffffffaa}.field:after{content:'';position:absolute;left:50%;top:10px;bottom:10px;border-left:2px solid #ffffff88}.gp{position:absolute;width:25px;height:25px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:8px;font-weight:900;color:#fff;z-index:3}.ours{background:#e33642;border:2px solid #fff}.theirs{background:#2680d9;border:2px solid #fff}.controlled{box-shadow:0 0 0 4px #ffe13b}.ball{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #222;transform:translate(-50%,-50%);z-index:5}.joy{position:absolute;left:24px;bottom:25px;width:120px;height:120px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;z-index:8;touch-action:none}.knob{position:absolute;left:38px;top:38px;width:42px;height:42px;border-radius:50%;background:#ffffff88}.gameBtns{position:absolute;right:15px;bottom:20px;width:170px;height:145px;z-index:8}.gb{position:absolute;width:58px;height:58px;border-radius:50%;border:2px solid #ffffff88;background:#071722bb;color:#fff;font-weight:900}.shoot{right:0;top:0}.pass{right:65px;top:55px}.dash{right:0;top:75px}.switch{right:95px;top:0}.landscapeMsg{display:none;position:fixed;inset:0;background:#06131e;z-index:120;align-items:center;justify-content:center;text-align:center;font-size:20px}@media(orientation:portrait){.playbox.on .landscapeMsg{display:flex}}</style></head><body><div class="app"><header><h1>⚽ 北海道クラブマネージャー</h1><div class="sub">CLUB LEGACY · v0.7 PROTOTYPE</div></header><div class="stats"><div class="stat"><span>資金</span><b id="money"></b></div><div class="stat"><span>サポーター</span><b id="fans"></b></div><div class="stat"><span>シーズン</span><b id="season"></b></div></div><div class="hero"><h2>札幌ノルディアFC</h2><div id="heroText" class="meta"></div></div><main><section id="home" class="section on"></section><section id="players" class="section"></section><section id="league" class="section"></section><section id="town" class="section"></section><section id="scout" class="section"></section><section id="more" class="section"></section></main><nav class="bottom" id="bottom"></nav></div><div class="modal" id="modal"><div class="profile" id="profile"></div></div><div class="playbox" id="playbox"><div class="landscapeMsg">📱 iPhoneを横向きにしてください<br><small>横画面で試合を操作します</small></div><div class="gamebar"><button class="mini secondary" onclick="quitPlay()">終了</button><span id="gameScore">0 - 0</span><span id="gameTime">0'</span></div><div class="field" id="field"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="gameBtns"><button class="gb switch" onclick="switchPlayer()">切替</button><button class="gb shoot" onclick="kickBall('shoot')">SHOOT</button><button class="gb pass" onclick="kickBall('pass')">PASS</button><button class="gb dash" id="dashBtn">DASH</button></div></div></div><script>const KEY='hcm-v02',MY='札幌ノルディアFC',RIVAL='旭川ヴァルク',schedule=['青森ブリザード','千葉オルカ',RIVAL,'仙台レグルス','横浜セイラーズ','新潟アルビオン','東京クロノス','鹿児島サザンクロス','名古屋グランツ','福岡アトラス','神戸ハーバーズ','広島レッドアロー','大阪フェニックス'];const navs=[['home','🏠','ホーム'],['players','👥','編成'],['league','🏆','リーグ'],['town','🏙️','街'],['scout','🔎','移籍'],['more','☰','その他']];let g=JSON.parse(localStorage.getItem(KEY)||'null'),picked=null,subtab='squad';const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));if(!g){alert('セーブデータがありません');throw 0}function band(p){if(p==='GK')return'gk';if(['CB','SB','LB','RB','LWB','RWB'].includes(p))return'df';if(['CF','ST','LW','RW','LWG','RWG'].includes(p))return'fw';return'mf'}function hydrate(){g.formation=g.formation||'4-3-3';g.transferList=g.transferList||[];g.players.forEach((p,i)=>{p.role=p.role||(p.starter?'starter':i<18?'bench':'out');p.starter=p.role==='starter';p.age=p.age||r(18,32);p.salary=p.salary||Math.max(500,Math.round(p.ovr*p.ovr*1.8));p.contract=p.contract||r(1,4);p.value=p.value||Math.round(p.ovr*p.ovr*12);p.mood=p.mood||r(70,98);p.traits=p.traits||[p.ovr>90?'クラブの象徴':p.age<21?'若手有望株':'チームプレーヤー']});ensureXI();if(!g.market)makeMarket()}function ensureXI(){let s=g.players.filter(p=>p.role==='starter');if(!s.some(p=>p.pos==='GK')){let k=g.players.find(p=>p.pos==='GK');if(k){let d=s.sort((a,b)=>a.ovr-b.ovr)[0];if(d)d.role='bench';k.role='starter'}}s=g.players.filter(p=>p.role==='starter');if(s.length>11)s.sort((a,b)=>b.ovr-a.ovr).slice(11).forEach(p=>p.role='bench');if(s.length<11)g.players.filter(p=>p.role!=='starter').sort((a,b)=>b.ovr-a.ovr).slice(0,11-s.length).forEach(p=>p.role='starter');g.players.forEach(p=>p.starter=p.role==='starter')}function makeMarket(){let names=['宮崎 拓真','荒川 慎','須賀 大輝','小牧 亮太','深谷 一希','黒崎 蓮','松木 海斗','伊東 颯真','ルイス・マテオ','ダニエル・ロッシ'];let pos=['DMF','CMF','LB','AMF','CB','CF','RW','GK','LW','CF'];g.market=names.map((n,i)=>{let o=r(55,92);return{id:900+i,n,pos:pos[i],ovr:o,age:r(17,29),value:Math.round(o*o*r(8,18)),salary:Math.round(o*o*r(1,3)),club:['旭川ヴァルク','東京クロノス','横浜セイラーズ','サンパウロ・アウロラ','ミラノ・ネロ'][i%5],talent:r(2,7)}})}hydrate();const save=()=>localStorage.setItem(KEY,JSON.stringify(g)),yen=n=>n>=1e8?(n/1e8).toFixed(1)+'億':Math.floor(n/1e4)+'万',opp=()=>schedule[(g.week-1)%schedule.length],row=n=>g.table.find(x=>x.n===n),starters=()=>g.players.filter(p=>p.role==='starter').slice(0,11);function teamPower(){let s=starters();return Math.round(s.reduce((a,p)=>a+p.ovr,0)/(s.length||1))}function oppPower(n){return Math.round(row(n)?.power||65)}function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('on',x.id===id));picked=null;render();scrollTo(0,0)}function render(){money.textContent=yen(g.money)+'円';fans.textContent=(g.fans||0).toLocaleString()+'人';season.textContent=`S${g.season} W${g.week}`;let me=row(MY)||{w:0,d:0,l:0},o=opp();heroText.textContent=`${me.w}勝 ${me.d}分 ${me.l}敗 ｜ チーム力 ${teamPower()} ｜ ${g.formation}`;bottom.innerHTML=navs.map(x=>`<button class="${document.getElementById(x[0]).classList.contains('on')?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');home.innerHTML=`<div class="card"><div class="strength"><div><b>${MY}</b><div class="num good">${teamPower()}</div></div><b>VS</b><div><b>${o}</b><div class="num">${oppPower(o)}</div></div></div><div class="modes"><button class="action" onclick="startMatch('skip')">⏭ スキップ</button><button class="action" onclick="startMatch('watch')">👀 視聴</button><button class="action" onclick="startMatch('play')">🎮 プレイ</button></div></div><h3>クラブニュース</h3><div class="card">${(g.logs||[]).slice(-6).reverse().join('<br>')}</div>`;players.innerHTML=squadHTML();league.innerHTML=leagueHTML();town.innerHTML=`<h3>クラブ経営</h3><div class="card"><b>年間人件費</b><div class="num">${yen(g.players.reduce((a,p)=>a+p.salary*10000,0))}</div><p class="meta">スタジアム・練習場・ユース施設の成長と連動予定</p></div>`;scout.innerHTML=marketHTML();more.innerHTML=`<h3>その他</h3><div class="card"><b>⚙️ 開発者メニュー</b><div class="controls"><button class="mini" onclick="cash(1e8)">+1億</button><button class="mini" onclick="cash(1e9)">+10億</button><button class="mini" onclick="cash(1e10)">+100億</button></div></div>`}function squadHTML(){let tabs=`<div class="tabs"><button class="mini ${subtab==='squad'?'on':''}" onclick="subtab='squad';render()">編成</button><button class="mini ${subtab==='contract'?'on':''}" onclick="subtab='contract';render()">契約</button><button class="mini ${subtab==='record'?'on':''}" onclick="subtab='record';render()">記録</button></div>`;if(subtab==='contract')return`<h3>選手・契約</h3>${tabs}<div class="card">${[...g.players].sort((a,b)=>b.ovr-a.ovr).map(p=>`<div class="playerrow"><div><b>${p.n}</b> <span class="tag">${p.pos}</span><br><span class="meta">OVR ${p.ovr}｜${p.age}歳｜年俸 ${yen(p.salary*10000)}｜残り${p.contract}年｜満足 ${p.mood}</span></div><button class="mini" onclick="renew(${p.id})">更新</button></div>`).join('')}</div>`;if(subtab==='record')return`<h3>クラブ記録</h3>${tabs}<div class="card"><b>🏅 レジェンド記録</b><p>最高OVR　${[...g.players].sort((a,b)=>b.ovr-a.ovr)[0]?.n} ${Math.max(...g.players.map(p=>p.ovr))}</p><p class="meta">最多出場・得点・北海ダービー記録は試合データ蓄積後に解放</p></div>`;return`<h3>チーム編成</h3>${tabs}<div class="formation">${['4-3-3','4-4-2','3-4-2-1'].map(f=>`<button class="mini secondary ${g.formation===f?'on':''}" onclick="g.formation='${f}';save();render()">${f}</button>`).join('')}</div><div class="hint">上が攻撃方向 ▲　①選手をタップ → ②入替相手をタップ</div><div class="moveMsg">${picked!=null?'選択中：'+g.players.find(p=>p.id===picked)?.n:''}</div>${boardHTML()}`}function token(p){return`<div class="token ${band(p.pos)} ${picked===p.id?'selected':''}" onclick="playerTap(event,${p.id})"><b>${p.ovr}</b><small>${p.n.split(' ')[0]}</small><small>${p.pos}</small></div>`}function boardHTML(){let s=starters(),ps=formationPositions(g.formation),b=g.players.filter(p=>p.role==='bench'),o=g.players.filter(p=>p.role==='out');return`<div class="board"><div class="pitch"><div class="attack">▲ ATTACK</div>${s.map((p,i)=>`<div class="slot" style="left:${ps[i][0]}%;top:${ps[i][1]}%">${token(p)}</div>`).join('')}</div><div class="side"><div class="pool"><h4>BENCH</h4>${b.map(token).join('')}</div><div class="pool"><h4>OUT</h4>${o.map(token).join('')}</div></div></div>`}function formationPositions(f){let M={'4-3-3':[[50,91],[14,73],[38,73],[62,73],[86,73],[25,52],[50,43],[75,52],[16,18],[50,18],[84,18]],'4-4-2':[[50,91],[14,73],[38,73],[62,73],[86,73],[14,50],[38,43],[62,43],[86,50],[35,18],[65,18]],'3-4-2-1':[[50,91],[25,73],[50,73],[75,73],[12,54],[38,54],[62,54],[88,54],[34,35],[66,35],[50,17]]};let a=M[f].map(x=>[...x]),s=starters(),k=s.findIndex(p=>p.pos==='GK');if(k>0)[a[0],a[k]]=[a[k],a[0]];return a}function playerTap(e,id){e.stopPropagation();if(picked==null){picked=id;render();return}if(picked===id){picked=null;render();return}let a=g.players.find(p=>p.id===picked),b=g.players.find(p=>p.id===id),x=a.role;a.role=b.role;b.role=x;a.starter=a.role==='starter';b.starter=b.role==='starter';picked=null;save();render()}function renew(id){let p=g.players.find(x=>x.id===id),raise=Math.round(p.salary*(1.15+p.ovr/1000));if(g.money<raise*10000)return alert('資金不足');g.money-=raise*10000;p.salary=raise;p.contract=4;p.mood=Math.min(100,p.mood+8);g.logs.push(`${p.n}と4年契約を更新`);save();render()}function marketHTML(){return`<h3>移籍市場</h3><div class="card"><div class="meta">実在サッカー界を薄くモチーフにした架空選手＋完全オリジナル選手</div>${g.market.map(p=>`<div class="playerrow offer"><div><b>${p.n}</b> <span class="tag">${p.pos}</span><br><span class="meta">${p.club}｜${p.age}歳｜OVR ${p.ovr}｜才能 ${'★'.repeat(Math.min(7,p.talent))}<br>市場価値 ${yen(p.value*10000)}｜希望年俸 ${yen(p.salary*10000)}</span></div><button class="mini" onclick="buy(${p.id})">交渉</button></div>`).join('')}</div>`}function buy(id){let p=g.market.find(x=>x.id===id),fee=Math.round(p.value*10000*1.15);if(!confirm(`${p.n}\n移籍金 ${yen(fee)} で獲得交渉しますか？`))return;if(g.money<fee)return alert('資金不足');g.money-=fee;g.players.push({...p,id:Date.now(),role:'out',contract:4,mood:85,traits:['新加入']});g.market=g.market.filter(x=>x.id!==id);g.logs.push(`🔄 ${p.n}を${yen(fee)}で獲得`);save();render()}function leagueHTML(){let q=[...g.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));return`<h3>全国リーグ</h3><div class="card"><table class="table"><tr><th>#</th><th>クラブ</th><th>力</th><th>試</th><th>点</th></tr>${q.map((t,i)=>`<tr class="${t.n===MY?'me':t.n===RIVAL?'rival':''}"><td>${i+1}</td><td>${t.n}</td><td>${t.n===MY?teamPower():Math.round(t.power)}</td><td>${t.p}</td><td>${t.pts}</td></tr>`).join('')}</table></div>`}function cash(n){g.money+=n;save();render()}function startMatch(mode){if(mode==='play'){openPlay();return}let o=opp(),tp=teamPower(),op=oppPower(o),edge=(tp-op)/18,us=Math.max(0,r(0,3)+Math.round(Math.max(0,edge)*Math.random())),them=Math.max(0,r(0,3)+Math.round(Math.max(0,-edge)*Math.random()));if(mode==='skip'){finish(o,us,them);return}profile.innerHTML=`<div class="card"><h3>👀 試合視聴</h3><div class="strength"><b>${MY}</b><div class="num">${us} - ${them}</div><b>${o}</b></div><p class="meta">AI同士で試合。能力差が勝率に反映されます。</p><button class="action" style="width:100%" onclick="finish('${o}',${us},${them})">試合終了</button></div>`;modal.classList.add('on')}function result(t,a,b){t.p++;t.gf+=a;t.ga+=b;if(a>b){t.w++;t.pts+=3}else if(a===b){t.d++;t.pts++}else t.l++}function finish(o,a,b){result(row(MY),a,b);result(row(o),b,a);g.logs.push(`${o}戦 ${a}-${b}`);g.week++;save();modal.classList.remove('on');render();go('home')}let game=null,anim=null,joyVec={x:0,y:0},dash=false;function openPlay(){playbox.classList.add('on');let s=starters();game={opp:opp(),us:0,them:0,min:0,controlled:0,ball:{x:30,y:50,owner:0},ours:s.map((p,i)=>({p,x:15+(i%4)*10,y:15+Math.floor(i/4)*30})),theirs:s.map((p,i)=>({p:{ovr:oppPower(opp())},x:65+(i%4)*8,y:15+Math.floor(i/4)*30}))};drawGame();setupJoy();loop()}function drawGame(){if(!game)return;field.querySelectorAll('.gp,.ball').forEach(x=>x.remove());game.ours.forEach((x,i)=>field.insertAdjacentHTML('beforeend',`<div class="gp ours ${i===game.controlled?'controlled':''}" style="left:${x.x}%;top:${x.y}%">${x.p.ovr}</div>`));game.theirs.forEach(x=>field.insertAdjacentHTML('beforeend',`<div class="gp theirs" style="left:${x.x}%;top:${x.y}%"></div>`));field.insertAdjacentHTML('beforeend',`<div class="ball" style="left:${game.ball.x}%;top:${game.ball.y}%"></div>`);gameScore.textContent=`${game.us} - ${game.them}`;gameTime.textContent=Math.min(90,Math.floor(game.min))+"'"}function loop(){if(!game)return;let p=game.ours[game.controlled],speed=(.07+p.p.ovr/1800)*(dash?1.65:1);p.x=Math.max(3,Math.min(97,p.x+joyVec.x*speed));p.y=Math.max(4,Math.min(96,p.y+joyVec.y*speed));if(game.ball.owner===game.controlled){game.ball.x=p.x+2;game.ball.y=p.y}game.min+=.025;if(game.min>=90){let a=game.us,b=game.them,o=game.opp;quitPlay(false);finish(o,a,b);return}drawGame();anim=requestAnimationFrame(loop)}function setupJoy(){joy.onpointerdown=joy.onpointermove=e=>{if(e.buttons===0&&e.type==='pointermove')return;let q=joy.getBoundingClientRect(),x=e.clientX-(q.left+q.width/2),y=e.clientY-(q.top+q.height/2),m=Math.hypot(x,y)||1,k=Math.min(38,m);joyVec={x:x/m,y:y/m};knob.style.transform=`translate(${joyVec.x*k}px,${joyVec.y*k}px)`};joy.onpointerup=joy.onpointercancel=()=>{joyVec={x:0,y:0};knob.style.transform=''};dashBtn.onpointerdown=()=>dash=true;dashBtn.onpointerup=dashBtn.onpointercancel=()=>dash=false}function switchPlayer(){if(!game)return;game.controlled=(game.controlled+1)%game.ours.length;game.ball.owner=game.controlled;let p=game.ours[game.controlled];game.ball.x=p.x;game.ball.y=p.y}function kickBall(type){if(!game)return;let p=game.ours[game.controlled];if(type==='shoot'){let chance=Math.min(.75,.12+p.p.ovr/300+(p.x>70?.18:0));if(Math.random()<chance){game.us++;game.ball.x=50;game.ball.y=50;p.x=30;p.y=50}else{game.ball.x=Math.min(96,p.x+20);game.ball.owner=null}}else{let next=(game.controlled+1)%game.ours.length;game.controlled=next;game.ball.owner=next;game.ball.x=game.ours[next].x;game.ball.y=game.ours[next].y}}function quitPlay(back=true){cancelAnimationFrame(anim);game=null;playbox.classList.remove('on');joyVec={x:0,y:0};if(back)render()}render();</script></body></html>
