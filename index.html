<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>札幌ノルディアFC</title><style>*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:#06131e;color:#eef7fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#0b2435,#06131e)}header{padding:13px 14px 8px;background:#0b2639}h1{font-size:20px;margin:0}.sub,.meta{font-size:11px;color:#9eb8c8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px}.stat,.card{background:#102b3e;border:1px solid #28516a;border-radius:15px;padding:12px}.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:#91b2c7}.hero{margin:0 9px 10px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#17465e,#175b43)}.hero h2{margin:0 0 3px;font-size:21px}main{padding:0 8px 105px}.section{display:none}.section.on{display:block}.action,.mini{border:0;border-radius:11px;padding:10px;background:#2f9669;color:white;font-weight:800}.mini{padding:7px 9px}.secondary{background:#29495e}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;background:#0b2233f2;padding:7px 6px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);z-index:20}.bottom button{border:0;background:none;color:#9fb7c7;font-size:9px;padding:6px 0}.bottom b{display:block;font-size:19px}.bottom .on{color:#6be0a3}.strength{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.num{font-size:34px;font-weight:900}.good{color:#6bdfa5}.formation,.modes,.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.formation .on{background:#2f9669}.board{display:grid;grid-template-columns:minmax(0,1fr) 94px;gap:6px;margin-top:9px;height:560px}.pitch{position:relative;background:repeating-linear-gradient(0deg,#17613f 0 56px,#155a3b 56px 112px);border:2px solid #d9f0df99;border-radius:16px;overflow:hidden}.pitch:before{content:'';position:absolute;inset:7px;border:1px solid #fff7}.pitch:after{content:'';position:absolute;left:7px;right:7px;top:50%;border-top:1px solid #fff7}.attack{position:absolute;top:5px;left:0;right:0;text-align:center;font-size:9px;color:#d9f0dfaa}.slot{position:absolute;transform:translate(-50%,-50%);width:58px;height:57px;border-radius:10px;border:1px dashed #ffffff44;display:grid;place-items:center;z-index:2}.token{width:54px;min-height:52px;border-radius:10px;padding:3px 2px;text-align:center;color:#fff;box-shadow:0 2px 6px #0007;user-select:none;-webkit-user-select:none;cursor:pointer}.token.selected{outline:4px solid #fff;transform:scale(1.07);box-shadow:0 0 15px #fff8}.token b{font-size:15px;display:block}.token small{font-size:8px;line-height:1.05;display:block}.gk{background:#c74444}.df{background:#2473c5}.mf{background:#d3a51c;color:#14202b}.fw{background:#26945d}.side{display:grid;grid-template-rows:1fr 1fr;gap:6px;min-height:0}.pool{background:#102b3e;border:1px solid #28516a;border-radius:13px;padding:5px;overflow:auto}.pool h4{font-size:10px;margin:1px 0 5px;text-align:center;color:#a9c2d1}.pool .token{width:100%;min-height:43px;margin-bottom:5px}.hint{text-align:center;font-size:10px;color:#9eb8c8;margin:7px 0}.moveMsg{text-align:center;font-size:11px;min-height:18px;color:#fff}.table{width:100%;border-collapse:collapse;font-size:11px}.table td,.table th{padding:7px 3px;border-bottom:1px solid #24465a}.me{color:#6bdfa5;font-weight:900}.rival{color:#ffc461}.log{font-size:12px;line-height:1.7;color:#c0d3de}.modal{display:none;position:fixed;inset:0;background:#020a10ed;z-index:50;padding:30px 12px;overflow:auto}.modal.on{display:block}.profile{max-width:560px;margin:auto}.commentary{height:250px;overflow:auto;background:#061722;border-radius:14px;padding:10px;font-size:12px;line-height:1.8}.match{text-align:center;font-size:21px;padding:15px}.score{font-size:38px;font-weight:900}</style></head><body><div class="app"><header><h1>⚽ 北海道クラブマネージャー</h1><div class="sub">CLUB LEGACY · v0.6.1</div></header><div class="stats"><div class="stat"><span>資金</span><b id="money"></b></div><div class="stat"><span>サポーター</span><b id="fans"></b></div><div class="stat"><span>シーズン</span><b id="season"></b></div></div><div class="hero"><h2>札幌ノルディアFC</h2><div id="heroText" class="meta"></div></div><main><section id="home" class="section on"></section><section id="players" class="section"></section><section id="league" class="section"></section><section id="town" class="section"></section><section id="scout" class="section"></section><section id="more" class="section"></section></main><nav class="bottom" id="bottom"></nav></div><div class="modal" id="modal"><div class="profile" id="profile"></div></div><script>const KEY='hcm-v02',MY='札幌ノルディアFC',RIVAL='旭川ヴァルク',schedule=['青森ブリザード','千葉オルカ',RIVAL,'仙台レグルス','横浜セイラーズ','新潟アルビオン','東京クロノス','鹿児島サザンクロス','名古屋グランツ','福岡アトラス','神戸ハーバーズ','広島レッドアロー','大阪フェニックス'];const navs=[['home','🏠','ホーム'],['players','👥','編成'],['league','🏆','リーグ'],['town','🏙️','街'],['scout','🔎','発掘'],['more','☰','その他']];const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));let g=JSON.parse(localStorage.getItem(KEY)||'null');if(!g){alert('セーブデータがありません');throw 0}let picked=null;function band(pos){if(pos==='GK')return'gk';if(['CB','SB','LB','RB','LWB','RWB'].includes(pos))return'df';if(['CF','ST','LW','RW','LWG','RWG'].includes(pos))return'fw';return'mf'}function hydrate(){g.formation=g.formation||'4-3-3';g.derbyHistory=g.derbyHistory||{w:0,d:0,l:0};g.players.forEach((p,i)=>{p.role=p.role||(p.starter?'starter':i<18?'bench':'out');p.starter=p.role==='starter'});ensureXI()}function ensureXI(){let s=g.players.filter(p=>p.role==='starter');if(!s.some(p=>p.pos==='GK')){let k=g.players.find(p=>p.pos==='GK');if(k){let d=s.sort((a,b)=>a.ovr-b.ovr)[0];if(d)d.role='bench';k.role='starter'}}s=g.players.filter(p=>p.role==='starter');if(s.length>11)s.sort((a,b)=>b.ovr-a.ovr).slice(11).forEach(p=>p.role='bench');if(s.length<11)g.players.filter(p=>p.role!=='starter').sort((a,b)=>b.ovr-a.ovr).slice(0,11-s.length).forEach(p=>p.role='starter');g.players.forEach(p=>p.starter=p.role==='starter')}hydrate();const save=()=>localStorage.setItem(KEY,JSON.stringify(g)),yen=n=>n>=1e8?(n/1e8).toFixed(1)+'億':Math.floor(n/1e4)+'万',opp=()=>schedule[(g.week-1)%schedule.length],row=n=>g.table.find(x=>x.n===n),ranking=()=>[...g.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)),starters=()=>g.players.filter(p=>p.role==='starter').slice(0,11);function teamPower(){let s=starters();return Math.round(s.reduce((a,p)=>a+p.ovr,0)/(s.length||1))}function oppPower(n){return Math.round(row(n)?.power||65)}function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('on',x.id===id));picked=null;render();scrollTo(0,0)}function render(){money.textContent=yen(g.money)+'円';fans.textContent=g.fans.toLocaleString()+'人';season.textContent=`S${g.season} W${g.week}`;let me=row(MY),o=opp(),tp=teamPower(),op=oppPower(o);heroText.textContent=`${me.w}勝 ${me.d}分 ${me.l}敗 ｜ チーム力 ${tp} ｜ ${g.formation}`;bottom.innerHTML=navs.map(x=>`<button data-id="${x[0]}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on',document.getElementById(x.dataset.id).classList.contains('on')));home.innerHTML=`<div class="card"><div class="strength"><div><b>${MY}</b><div class="num good">${tp}</div></div><b>VS</b><div><b>${o}</b><div class="num">${op}</div></div></div><div class="modes"><button class="action" onclick="startMatch('skip')">⏭ スキップ</button><button class="action" onclick="startMatch('watch')">👀 視聴</button><button class="action" onclick="startMatch('play')">🎮 プレイ</button></div></div><h3>クラブニュース</h3><div class="card log">${g.logs.slice(-7).reverse().join('<br>')}</div>`;players.innerHTML=squadHTML();league.innerHTML=`<h3>全国リーグ</h3><div class="card"><table class="table"><tr><th>#</th><th>クラブ</th><th>力</th><th>試</th><th>点</th></tr>${ranking().map((t,i)=>`<tr class="${t.n===MY?'me':t.n===RIVAL?'rival':''}"><td>${i+1}</td><td>${t.n}</td><td>${t.n===MY?teamPower():Math.round(t.power)}</td><td>${t.p}</td><td>${t.pts}</td></tr>`).join('')}</table></div>`;town.innerHTML='<h3>ノルディアタウン</h3><div class="card">街づくりは次の大型更新でマップ化予定。</div>';scout.innerHTML='<h3>スカウト</h3><div class="card">スカウト候補リストを準備中。</div>';more.innerHTML=`<h3>その他</h3><div class="card"><b>⚙️ 開発者メニュー</b><div class="controls"><button class="mini" onclick="cash(1e8)">+1億</button><button class="mini" onclick="cash(1e9)">+10億</button><button class="mini" onclick="cash(1e10)">+100億</button></div></div>`}function squadHTML(){return`<h3>チーム編成</h3><div class="formation">${['4-3-3','4-4-2','3-4-2-1'].map(f=>`<button class="mini secondary ${g.formation===f?'on':''}" onclick="g.formation='${f}';picked=null;save();render()">${f}</button>`).join('')}</div><div class="card"><div class="strength"><div><span class="meta">チーム総合</span><div class="num good">${teamPower()}</div></div><div>⚽</div><div><span class="meta">次節相手</span><div class="num">${oppPower(opp())}</div></div></div></div><div class="hint">①選手をタップ　②入れ替えたい選手をタップ</div><div class="moveMsg">${picked!=null?'選択中：'+(g.players.find(p=>p.id===picked)?.n||'')+' → 入替相手をタップ':''}</div>${boardHTML()}`}function token(p){return`<div class="token ${band(p.pos)} ${picked===p.id?'selected':''}" data-player="${p.id}" onclick="playerTap(event,${p.id})"><b>${p.ovr}</b><small>${p.n.split(' ')[0]}</small><small>${p.pos}</small></div>`}function boardHTML(){let s=starters(),pos=formationPositions(g.formation),bench=g.players.filter(p=>p.role==='bench'),out=g.players.filter(p=>p.role==='out');return`<div class="board"><div class="pitch"><div class="attack">▲ ATTACK</div>${s.map((p,i)=>`<div class="slot" style="left:${pos[i][0]}%;top:${pos[i][1]}%">${token(p)}</div>`).join('')}</div><div class="side"><div class="pool"><h4>BENCH</h4>${bench.map(token).join('')}</div><div class="pool"><h4>OUT</h4>${out.map(token).join('')}</div></div></div>`}function formationPositions(f){let M={'4-3-3':[[50,91],[14,73],[38,73],[62,73],[86,73],[25,53],[50,45],[75,53],[16,18],[50,18],[84,18]],'4-4-2':[[50,91],[14,73],[38,73],[62,73],[86,73],[14,50],[38,43],[62,43],[86,50],[35,18],[65,18]],'3-4-2-1':[[50,91],[25,73],[50,73],[75,73],[12,53],[38,53],[62,53],[88,53],[34,35],[66,35],[50,17]]};let raw=M[f].map(x=>[...x]),s=starters(),gk=s.findIndex(p=>p.pos==='GK');if(gk>0)[raw[0],raw[gk]]=[raw[gk],raw[0]];return raw}function playerTap(ev,id){ev.preventDefault();ev.stopPropagation();if(picked==null){picked=id;render();return}if(picked===id){picked=null;render();return}let a=g.players.find(p=>p.id===picked),b=g.players.find(p=>p.id===id);if(!a||!b){picked=null;render();return}let ar=a.role;a.role=b.role;b.role=ar;a.starter=a.role==='starter';b.starter=b.role==='starter';picked=null;save();render()}function cash(n){g.money+=n;save();render()}function startMatch(mode){let o=opp(),tp=teamPower(),op=oppPower(o),base=tp/(tp+op),us=0,them=0,events=[];for(let m=7;m<90;m+=r(5,12)){if(Math.random()<.25){if(Math.random()<base){us++;events.push(`${m}' ⚽ ノルディア GOAL!`)}else{them++;events.push(`${m}' ⚽ ${o} GOAL`)}}else events.push(`${m}' ${Math.random()<base?'ノルディアが攻める':'相手の攻撃'}`)}if(mode==='skip'){finish(o,us,them);return}profile.innerHTML=`<div class="card"><h3>${mode==='play'?'🎮 PLAY MODE':'👀 試合視聴'}</h3><div class="match">${MY}<div class="score">${us} - ${them}</div>${o}</div><div class="commentary">${events.map(e=>'<div>'+e+'</div>').join('')}</div><button class="action" style="width:100%;margin-top:8px" onclick="finish('${o}',${us},${them})">試合終了</button></div>`;modal.classList.add('on')}function result(t,a,b){t.p++;t.gf+=a;t.ga+=b;if(a>b){t.w++;t.pts+=3}else if(a===b){t.d++;t.pts++}else t.l++}function finish(o,us,them){let me=row(MY),ot=row(o);result(me,us,them);result(ot,them,us);g.logs.push(`${o}戦 ${us}-${them}`);g.week++;save();modal.classList.remove('on');render();go('home')}render();</script></body></html>
