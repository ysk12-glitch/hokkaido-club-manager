<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>北海道クラブマネージャー</title><style>*{box-sizing:border-box}body{margin:0;background:#07131f;color:#eef5fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#0b2335,#07131f)}header{padding:14px 16px 10px;background:#0d2b40}h1{font-size:21px;margin:0}.sub,.meta{font-size:11px;color:#9db9c9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.stat,.card{background:#102b3e;border:1px solid #244d67;border-radius:15px;padding:12px}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:#91b2c7}.hero{margin:0 10px 10px;padding:15px;border-radius:18px;background:linear-gradient(135deg,#17435b,#14553e)}.hero h2{margin:0 0 4px}main{padding:0 12px 105px}.section{display:none}.section.on{display:block}.action,.mini{border:0;border-radius:12px;padding:11px;background:#2d8b63;color:#fff;font-weight:800}.mini{padding:8px}.match{font-size:23px;text-align:center;padding:18px 8px}.derby{border-color:#e7a53b;box-shadow:0 0 18px #e7a53b33}.derbyTitle{color:#ffbd55;font-weight:900}.log{font-size:12px;line-height:1.7;color:#bfd0da}.player{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;margin-bottom:9px;position:relative;overflow:hidden}.portrait{width:70px;height:82px;border-radius:12px;background:linear-gradient(160deg,#b7c7cf 0 38%,#d2aa88 39% 61%,#142e44 62%);position:relative;overflow:hidden;box-shadow:inset 0 0 25px #0005}.portrait:before{content:'';position:absolute;width:31px;height:37px;border-radius:48% 48% 45% 45%;background:#d5ad8b;left:20px;top:15px;box-shadow:0 -8px 0 #27211f}.portrait:after{content:'';position:absolute;width:54px;height:40px;border-radius:45% 45% 0 0;background:#23694f;left:8px;top:54px}.monster .portrait{box-shadow:0 0 20px #9c6cff99,inset 0 0 20px #0005}.name{font-weight:800}.ovr{font-size:25px;font-weight:900;color:#65d59c;text-align:center}.bar{height:6px;background:#071722;border-radius:9px;margin:5px 0;overflow:hidden}.bar i{display:block;height:100%;background:#4fc58a}.monster{border-color:#9c6cff}.monster .ovr{color:#bd92ff}.badge,.trait{font-size:9px;padding:3px 6px;border-radius:12px;background:#744ab0;display:inline-block;margin:2px}.trait{background:#244c63;color:#cfe4ef}.facility{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:8px 4px;border-bottom:1px solid #24465a;text-align:center}.table td:nth-child(2),.table th:nth-child(2){text-align:left}.me{color:#69d89f;font-weight:900}.rival{color:#ffbd55}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;background:#0b2233f2;backdrop-filter:blur(12px);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:4px;z-index:20}.bottom button{border:0;background:transparent;color:#9fb7c7;font-size:10px;padding:7px 1px}.bottom button b{display:block;font-size:20px}.bottom button.on{color:#6be0a3}.next{width:100%;margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#020a10dd;z-index:50;padding:calc(25px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));overflow:auto}.modal.on{display:block}.profile{max-width:560px;margin:auto}.profileHero{display:grid;grid-template-columns:120px 1fr;gap:15px;align-items:end;background:linear-gradient(145deg,#173f55,#10283a);padding:16px;border-radius:22px}.bigPortrait{width:120px;height:145px}.bigPortrait:before{width:50px;height:58px;left:35px;top:24px}.bigPortrait:after{width:95px;height:72px;left:13px;top:88px}.bigOvr{font-size:52px;font-weight:900;color:#65d59c}.ability{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:13px;margin:9px 0}.ability span:last-child{font-weight:900}.abilitybar{grid-column:1/3;height:5px;background:#081923;border-radius:8px;overflow:hidden}.abilitybar i{display:block;height:100%;background:#4fc58a}.focus{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.focus button{font-size:11px}.close{width:100%;margin-top:10px;background:#30485a}.history{font-size:11px;line-height:1.8;color:#b9ced9}</style></head><body><div class="app"><header><h1>⚽ 北海道クラブマネージャー</h1><div class="sub">ROAD TO JAPAN'S TOP FLIGHT · v0.3</div></header><div class="stats"><div class="stat"><span>資金</span><b id="money"></b></div><div class="stat"><span>サポーター</span><b id="fans"></b></div><div class="stat"><span>シーズン</span><b id="season"></b></div></div><div class="hero"><h2 id="clubName"></h2><div id="heroText" class="meta"></div></div><main><section id="home" class="section on"></section><section id="players" class="section"></section><section id="league" class="section"></section><section id="town" class="section"></section><section id="scout" class="section"></section><section id="more" class="section"></section></main><nav class="bottom" id="bottom"></nav></div><div class="modal" id="modal"><div class="profile" id="profile"></div></div><script>
const KEY='hcm-v02',MY='札幌ノルディアFC',RIVAL='旭川ヴァルク';const clubs=[MY,RIVAL,'青森ブリザード','仙台レグルス','新潟アルビオン','千葉オルカ','東京クロノス','横浜セイラーズ','名古屋グランツ','大阪フェニックス','神戸ハーバーズ','広島レッドアロー','福岡アトラス','鹿児島サザンクロス'];const schedule=['青森ブリザード','千葉オルカ',RIVAL,'仙台レグルス','横浜セイラーズ','新潟アルビオン','東京クロノス','鹿児島サザンクロス','名古屋グランツ','福岡アトラス','神戸ハーバーズ','広島レッドアロー','大阪フェニックス'];const names=['佐藤 大輝','高橋 悠真','中村 海斗','伊藤 蓮','山本 陽翔','小林 蒼','加藤 湊','吉田 樹','山田 颯太','松本 悠斗','井上 朝陽','木村 陸','林 大和','斎藤 翼','清水 奏太','阿部 玲央','森 悠生','池田 新','橋本 碧','石川 凛'];const positions=['GK','CB','CB','LB','RB','DMF','CMF','CMF','AMF','RW','CF','GK','CB','SB','DMF','CMF','AMF','LW','CF','CF'];const traitPool=['裏抜け◎','ミドル砲','パサー','対人守備◎','空中戦◎','鉄人','大舞台◎','左足の魔術師','スピードスター','クラブ愛','司令塔','守護神'];function mkPlayer(n,i){let o=45+Math.floor(Math.random()*28);return{id:i,n,pos:positions[i],age:18+i%14,ovr:o,xp:0,love:1+Math.floor(Math.random()*3),monster:false,traits:[traitPool[(i*3)%traitPool.length]],history:[],ab:{shot:o+rand(-7,8),pass:o+rand(-7,8),dribble:o+rand(-7,8),defense:o+rand(-7,8),speed:o+rand(-7,8),physical:o+rand(-7,8),stamina:o+rand(-7,8),mental:o+rand(-7,8)}}}function fresh(){return{season:1,week:1,money:3e8,fans:1820,fac:{stadium:1,training:1,academy:1,station:1,shops:1},players:names.map(mkPlayer),table:clubs.map((n,i)=>({n,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,power:50+i*2+rand(0,8)})),logs:['クラブが始動。札幌から全国の頂点を目指す。']}}function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}let g;try{g=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){g=fresh()}function hydrate(){g.players.forEach((p,i)=>{if(!p.ab)p.ab={shot:p.ovr+rand(-7,8),pass:p.ovr+rand(-7,8),dribble:p.ovr+rand(-7,8),defense:p.ovr+rand(-7,8),speed:p.ovr+rand(-7,8),physical:p.ovr+rand(-7,8),stamina:p.ovr+rand(-7,8),mental:p.ovr+rand(-7,8)};if(!p.traits)p.traits=[traitPool[(i*3)%traitPool.length]];if(!p.history)p.history=[]})}hydrate();function save(){localStorage.setItem(KEY,JSON.stringify(g))}const yen=n=>n>=1e8?(n/1e8).toFixed(1)+'億':Math.floor(n/1e4)+'万';const navs=[['home','🏠','ホーム'],['players','👥','選手'],['league','🏆','リーグ'],['town','🏙️','街'],['scout','🔎','発掘'],['more','☰','その他']];function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on',x.dataset.id===id));scrollTo(0,0)}function nextOpp(){return schedule[(g.week-1)%schedule.length]}function row(n){return g.table.find(x=>x.n===n)}function rank(){return [...g.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}function render(){money.textContent=yen(g.money)+'円';fans.textContent=g.fans.toLocaleString()+'人';season.textContent='S'+g.season+' W'+g.week;clubName.textContent=MY;let me=row(MY);heroText.textContent=`${me.w}勝 ${me.d}分 ${me.l}敗 ｜ ${rank().findIndex(x=>x.n===MY)+1}位 ｜ ${3000*g.fac.stadium}席`;bottom.innerHTML=navs.map((x,i)=>`<button data-id="${x[0]}" class="${i?'':'on'}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');let opp=nextOpp(),derby=opp===RIVAL;home.innerHTML=`<div class="card ${derby?'derby':''}">${derby?'<div class="derbyTitle">🔥 北海ダービー</div>':''}<div class="match"><b>${MY}</b><br><small>VS</small><br><b>${opp}</b></div><button class="action next" onclick="playMatch()">⚽ 第${g.week}節を戦う</button></div><h3>クラブニュース</h3><div class="card log">${g.logs.slice(-7).reverse().join('<br>')}</div>`;players.innerHTML='<h3>トップチーム <span class="meta">選手をタップで詳細</span></h3>'+[...g.players].sort((a,b)=>b.ovr-a.ovr).map(p=>`<div class="card player ${p.monster?'monster':''}" onclick="openPlayer(${p.id})"><div class="portrait"></div><div><div class="name">${p.n} ${p.monster?'<span class="badge">怪物</span>':''}</div><div class="meta">${p.pos}・${p.age}歳・クラブ愛★${p.love}</div><div>${p.traits.map(x=>`<span class="trait">${x}</span>`).join('')}</div><div class="bar"><i style="width:${p.xp%100}%"></i></div></div><div><div class="meta">総合</div><div class="ovr">${p.ovr}</div></div></div>`).join('');let r=rank();league.innerHTML=`<h3>全国リーグ</h3><div class="card"><table class="table"><tr><th>順位</th><th>クラブ</th><th>試</th><th>勝点</th><th>得失</th></tr>${r.map((t,i)=>`<tr class="${t.n===MY?'me':t.n===RIVAL?'rival':''}"><td>${i+1}</td><td>${t.n}${t.n===RIVAL?' 🔥':''}</td><td>${t.p}</td><td>${t.pts}</td><td>${t.gf-t.ga>0?'+':''}${t.gf-t.ga}</td></tr>`).join('')}</table></div>`;town.innerHTML='<h3>街づくり</h3>'+Object.entries({stadium:'🏟️ スタジアム',training:'🏋️ 練習場',academy:'🌱 アカデミー',station:'🚉 駅・アクセス',shops:'🏪 商店街'}).map(([k,n])=>`<div class="card facility"><div><b>${n}</b><div class="meta">LEVEL ${g.fac[k]}</div></div><button class="mini" onclick="upgrade('${k}')">${yen(g.fac[k]*2e7)}円</button></div>`).join('');scout.innerHTML=`<h3>スカウト</h3><div class="card"><b>全国・海外スカウト網</b><p class="meta">日本人中心。外国籍選手や、ごく稀に規格外の「怪物」を発見する。</p><button class="action" onclick="scoutOne()">🔎 500万円で探索</button></div>`;more.innerHTML=`<h3>クラブ情報</h3><div class="card"><b>${MY}</b><p class="meta">本拠地：北海道・札幌<br>宿敵：${RIVAL}<br>育成方針：能力上限なし・年齢による強制劣化なし</p></div>`}const labels={shot:'シュート',pass:'パス',dribble:'ドリブル',defense:'守備',speed:'スピード',physical:'フィジカル',stamina:'スタミナ',mental:'メンタル'};function openPlayer(id){let p=g.players.find(x=>x.id===id);profile.innerHTML=`<div class="profileHero ${p.monster?'monster':''}"><div class="portrait bigPortrait"></div><div><div class="meta">${p.pos} / ${p.age}歳</div><h2>${p.n}</h2><div class="bigOvr">${p.ovr}</div><div>${p.traits.map(x=>`<span class="trait">${x}</span>`).join('')}</div></div></div><h3>能力</h3><div class="card">${Object.entries(p.ab).map(([k,v])=>`<div class="ability"><span>${labels[k]}</span><span>${Math.round(v)}</span><div class="abilitybar"><i style="width:${Math.min(100,v)}%"></i></div></div>`).join('')}</div><h3>個人育成</h3><div class="focus"><button class="mini" onclick="trainFocus(${p.id},'shot')">⚽ シュート</button><button class="mini" onclick="trainFocus(${p.id},'pass')">🎯 パス</button><button class="mini" onclick="trainFocus(${p.id},'speed')">💨 走力</button><button class="mini" onclick="trainFocus(${p.id},'defense')">🛡️ 守備</button><button class="mini" onclick="trainFocus(${p.id},'physical')">💪 肉体</button><button class="mini" onclick="trainFocus(${p.id},'all')">🔥 総合</button></div><h3>成長記録</h3><div class="card history">${p.history.length?p.history.slice(-8).reverse().join('<br>'):'まだ成長記録はありません。'}</div><button class="action close" onclick="closePlayer()">戻る</button>`;modal.classList.add('on')}function closePlayer(){modal.classList.remove('on')}function trainFocus(id,key){let p=g.players.find(x=>x.id===id),cost=Math.max(1,Math.floor(p.ovr/50))*1e6;if(g.money<cost)return alert('資金不足');g.money-=cost;let boost=p.monster?rand(3,6):rand(2,4);if(key==='all'){Object.keys(p.ab).forEach(k=>p.ab[k]+=rand(0,2));p.ovr+=rand(1,3)+(p.monster?1:0)}else{p.ab[key]+=boost;p.ovr+=Math.random()<.65?1:0}p.xp+=rand(18,35);if(p.xp>=100){p.ovr++;p.xp-=100}let text=`S${g.season} W${g.week}：${key==='all'?'総合':labels[key]}強化 → 総合${p.ovr}`;p.history.push(text);g.logs.push(`${p.n}が成長。総合${p.ovr}！`);save();render();openPlayer(id)}function result(t,a,b){t.p++;t.gf+=a;t.ga+=b;if(a>b){t.w++;t.pts+=3}else if(a===b){t.d++;t.pts++}else t.l++}function playMatch(){let opp=nextOpp(),me=row(MY),ot=row(opp),avg=[...g.players].sort((a,b)=>b.ovr-a.ovr).slice(0,11).reduce((s,p)=>s+p.ovr,0)/11,derby=opp===RIVAL,us=Math.max(0,Math.floor(Math.random()*3.6+(avg-ot.power)/24+(derby?.25:0))),them=Math.max(0,Math.floor(Math.random()*3+(ot.power-avg)/28));result(me,us,them);result(ot,them,us);let others=g.table.filter(x=>x.n!==MY&&x.n!==opp);for(let i=0;i+1<others.length;i+=2){let a=others[i],b=others[i+1],aa=rand(0,3),bb=rand(0,3);result(a,aa,bb);result(b,bb,aa)}let att=Math.min(3000*g.fac.stadium,Math.floor(g.fans*(derby?1.25:.55+Math.random()*.3)));g.money+=att*(derby?2800:2200);if(us>them)g.fans+=80+rand(0,130)+(derby?180:0);else if(us<them)g.fans=Math.max(300,g.fans-(derby?35:20));g.players.forEach(p=>{p.xp+=rand(5,14);if(p.xp>=100){p.ovr++;p.xp-=100;p.history.push(`S${g.season} W${g.week}：試合経験で総合${p.ovr}`)}});g.logs.push(`${derby?'🔥 北海ダービー ':'⚽ '}${opp}戦 ${us}-${them} ${us>them?'勝利！':us===them?'引分':'敗戦'} 観客${att.toLocaleString()}人`);let msg=`${derby?'🔥 北海ダービー\n':''}${MY} ${us} - ${them} ${opp}\n観客 ${att.toLocaleString()}人`;advance();alert(msg)}function advance(){g.week++;if(g.week>26){let place=rank().findIndex(x=>x.n===MY)+1;g.season++;g.week=1;g.money+=place<=3?12e7:5e7;g.logs.push(`🏁 シーズン終了：${place}位。新シーズン開幕！`);g.table=clubs.map((n,i)=>({n,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,power:52+i*2+g.season+rand(0,8)}))}save();render();go('home')}function upgrade(k){let c=g.fac[k]*2e7;if(g.money<c)return alert('資金不足');g.money-=c;g.fac[k]++;if(k==='station'||k==='shops')g.fans+=250*g.fac[k];g.logs.push(`🏙️ 街の施設がLv.${g.fac[k]}へ発展。`);save();render();go('town')}function scoutOne(){if(g.money<5e6)return alert('資金不足');g.money-=5e6;let f=Math.random()<.22,m=Math.random()<.025,first=f?['Lucas','Mateus','Kim','Park','Léo','Noah'][rand(0,5)]:['神谷','北村','橘','黒田','白石','三浦'][rand(0,5)],last=f?[' Silva',' Costa',' Min-jun',' Joon',' Santos',' Müller'][rand(0,5)]:[' 蓮',' 海',' 岳',' 凪',' 翼',' 迅'][rand(0,5)],o=m?rand(105,159):rand(48,87),p={id:Date.now(),n:first+last,pos:['CF','AMF','CMF','CB','GK'][rand(0,4)],age:rand(16,30),ovr:o,xp:0,love:1,monster:m,traits:[m?'規格外の才能':traitPool[rand(0,traitPool.length-1)]],history:[],ab:{shot:o+rand(-8,8),pass:o+rand(-8,8),dribble:o+rand(-8,8),defense:o+rand(-8,8),speed:o+rand(-8,8),physical:o+rand(-8,8),stamina:o+rand(-8,8),mental:o+rand(-8,8)}};g.players.push(p);g.logs.push(`🔎 ${m?'【怪物発見】':''}${p.n} 総合${p.ovr}を獲得！`);save();render();go('scout');alert(`${m?'⚡ 怪物発見！\n':''}${p.n}\n${p.pos} / ${p.age}歳 / 総合${p.ovr}`)}render();</script></body></html>
