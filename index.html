<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>札幌ノルディアFC</title><style>*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:#06131e;color:#eef7fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#0b2435,#06131e)}header{padding:12px 14px 7px;background:#0b2639}h1{font-size:19px;margin:0}.sub,.meta{font-size:10px;color:#9eb8c8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}.stat,.card{background:#102b3e;border:1px solid #28516a;border-radius:14px;padding:11px}.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:#91b2c7}.hero{margin:0 8px 9px;padding:12px;border-radius:17px;background:linear-gradient(135deg,#17465e,#175b43)}.hero h2{margin:0;font-size:20px}main{padding:0 7px 100px}.section{display:none}.section.on{display:block}.action,.mini{border:0;border-radius:10px;padding:9px;background:#2f9669;color:#fff;font-weight:800}.mini{padding:7px}.secondary{background:#29495e}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;background:#0b2233f2;padding:6px 5px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);z-index:20}.bottom button{border:0;background:none;color:#9fb7c7;font-size:9px;padding:5px 0}.bottom b{display:block;font-size:18px}.bottom .on{color:#6be0a3}.strength{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.num{font-size:32px;font-weight:900}.good{color:#6bdfa5}.formation,.modes,.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0}.formation .on{background:#2f9669}.board{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:5px;margin-top:7px;height:555px}.pitch{position:relative;background:repeating-linear-gradient(0deg,#17613f 0 56px,#155a3b 56px 112px);border:2px solid #d9f0df99;border-radius:15px;overflow:hidden}.pitch:before{content:'';position:absolute;inset:7px;border:1px solid #fff7}.pitch:after{content:'';position:absolute;left:7px;right:7px;top:50%;border-top:1px solid #fff7}.attack{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:9px;color:#d9f0dfaa}.slot{position:absolute;transform:translate(-50%,-50%);width:56px;height:55px;border-radius:9px;border:1px dashed #ffffff44;display:grid;place-items:center;z-index:2}.slot.target{border:2px solid #fff;background:#ffffff22}.token{width:52px;min-height:50px;border-radius:9px;padding:3px 2px;text-align:center;color:#fff;box-shadow:0 2px 6px #0007;user-select:none;position:relative}.token.selected{outline:4px solid #fff;transform:scale(1.06);z-index:5}.token b{font-size:14px;display:block}.token small{font-size:7px;line-height:1.05;display:block}.gk{background:#c74444}.df{background:#2473c5}.mf{background:#d3a51c;color:#14202b}.fw{background:#26945d}.side{display:grid;grid-template-rows:1fr 1fr;gap:5px;min-height:0}.pool{background:#102b3e;border:1px solid #28516a;border-radius:12px;padding:4px;overflow:auto}.pool h4{font-size:9px;margin:1px 0 4px;text-align:center;color:#a9c2d1}.pool .token{width:100%;min-height:42px;margin-bottom:4px}.hint,.moveMsg{text-align:center;font-size:10px;color:#9eb8c8;margin:5px 0;min-height:14px}.table{width:100%;border-collapse:collapse;font-size:10px}.table td,.table th{padding:6px 3px;border-bottom:1px solid #24465a}.me{color:#6bdfa5;font-weight:900}.rival{color:#ffc461}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}.playerrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #28475a}.modal{display:none;position:fixed;inset:0;background:#020a10f5;z-index:50;padding:18px 10px;overflow:auto}.modal.on{display:block}.profile{max-width:680px;margin:auto} .slot{width:22%;height:8%;min-height:34px;border-radius:7px}.slot.ready{border-color:#c6ffca}.slot .token{width:100%;min-height:100%;height:100%;padding:2px 0}.slot .token b{font-size:12px}.slot .token small{font-size:7px}.slot .empty{font-size:8px;color:#c8e4d4;text-align:center}.slot .fit{position:absolute;top:-5px;right:-3px;border-radius:9px;background:#06131e;color:#fff;font-size:10px;padding:0 3px}.board{height:590px}.pitch{overflow:hidden}.pool{cursor:pointer}.pool h4{position:sticky;top:0;background:#102b3e;z-index:3}.trainingRow{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.trainingRow select{min-width:0;flex:1;background:#19384b;color:white;border:1px solid #45687d;border-radius:8px;padding:8px;font-size:12px}.chemline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}.chemline line{stroke:#d8eee6;stroke-width:1.2;opacity:.7}.chemline line.strong{stroke:#f8cf49;stroke-width:2}.profileCard{background:#102b3e;border:1px solid #4c7186;border-radius:14px;padding:15px}.profileHero{display:flex;gap:15px;align-items:center}.portrait{width:100px;height:135px;background:linear-gradient(140deg,#236d60,#10263b);border:2px solid #e0c16a;border-radius:12px;display:grid;place-items:center;font-size:26px}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detailGrid div{background:#214458;padding:9px;border-radius:8px}.detailGrid small{display:block;color:#a8c6d2}.squadTools{display:flex;gap:7px;margin:9px 0}.squadTools button{flex:1}.chemStat{font-size:11px;text-align:center;color:#a8c6d2}@media(min-width:700px){.app,.bottom{max-width:1100px}.board{grid-template-columns:minmax(0,1fr) 160px;height:610px}}</style></head><body><div class="app"><header><h1>⚽ 北海道クラブマネージャー</h1><div class="sub">CLUB LEGACY · v0.9.0</div></header><div class="stats"><div class="stat"><span>資金</span><b id="money"></b></div><div class="stat"><span>サポーター</span><b id="fans"></b></div><div class="stat"><span>シーズン</span><b id="season"></b></div></div><div class="hero"><h2>札幌ノルディアFC</h2><div id="heroText" class="meta"></div></div><main><section id="home" class="section on"></section><section id="players" class="section"></section><section id="league" class="section"></section><section id="town" class="section"></section><section id="scout" class="section"></section><section id="more" class="section"></section></main><nav class="bottom" id="bottom"></nav></div><div class="modal" id="modal"><div class="profile" id="profile"></div></div><script>const KEY='hcm-v02',MY='札幌ノルディアFC',RIVAL='旭川ヴァルク',schedule=['青森ブリザード','千葉オルカ',RIVAL,'仙台レグルス','横浜セイラーズ','新潟アルビオン','東京クロノス','鹿児島サザンクロス','名古屋グランツ','福岡アトラス','神戸ハーバーズ','広島レッドアロー','大阪フェニックス'];const navs=[['home','🏠','ホーム'],['players','👥','編成'],['league','🏆','リーグ'],['town','🏙️','街'],['scout','🔎','移籍'],['more','☰','その他']];let g=JSON.parse(localStorage.getItem(KEY)||'null'),picked=null,subtab='squad';const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));if(!g){alert('セーブデータがありません');throw 0}function player(id){return g.players.find(p=>p.id===id)}function band(p){if(p==='GK')return'gk';if(['CB','SB','LB','RB','LWB','RWB'].includes(p))return'df';if(['CF','ST','LW','RW','LWG','RWG'].includes(p))return'fw';return'mf'}const POS={
'4-3-3':[[50,91,'gk'],[13,73,'df'],[38,73,'df'],[63,73,'df'],[88,73,'df'],[25,52,'mf'],[50,52,'mf'],[75,52,'mf'],[17,20,'fw'],[50,18,'fw'],[83,20,'fw']],
'4-4-2':[[50,91,'gk'],[13,73,'df'],[38,73,'df'],[63,73,'df'],[88,73,'df'],[13,48,'mf'],[38,50,'mf'],[63,50,'mf'],[88,48,'mf'],[36,20,'fw'],[64,20,'fw']],
'3-4-2-1':[[50,91,'gk'],[25,74,'df'],[50,74,'df'],[75,74,'df'],[12,53,'mf'],[38,56,'mf'],[62,56,'mf'],[88,53,'mf'],[35,35,'mf'],[65,35,'mf'],[50,17,'fw']]};
function expected(i){return (g.placements?.[i]?.[2])||POS[g.formation][i]?.[2]||'mf'}
function fit(p,i){let a=band(p.pos),b=expected(i),xp=(p.positionXP||{})[b]||0;return a===b||xp>=12?'◎':xp>=5||(a==='mf'&&(b==='fw'||b==='df'))||(a==='fw'&&b==='mf')||(a==='df'&&b==='mf')?'○':'△'}
function slotScore(p,slot){let pos=p.pos||'',group=band(pos),want=slot[2],x=slot[0],y=slot[1],center=Math.abs(x-50),score=0;
if(want==='gk')score=group==='gk'?1000:-1000;
else if(want==='df'){score=group==='df'?500:group==='mf'?80:-250;if(pos==='CB')score+=center<20?85:0;if(['LB','LWB'].includes(pos))score+=x<40?100:-40;if(['RB','RWB'].includes(pos))score+=x>60?100:-40;if(pos==='SB')score+=center>15?70:20}
else if(want==='mf'){score=group==='mf'?460:group==='fw'?100:group==='df'?50:-500;let advanced=y<43,wide=center>25;if(pos==='AMF')score+=advanced?160:-25;if(pos==='DMF')score+=advanced?-90:110;if(pos==='CMF')score+=advanced?20:85;if(pos==='LW')score+=x<50&&wide?100:0;if(pos==='RW')score+=x>50&&wide?100:0}
else{score=group==='fw'?520:pos==='AMF'?130:-350;if(['CF','ST'].includes(pos))score+=center<22?160:20;if(['LW','LWG'].includes(pos))score+=x<40?160:-40;if(['RW','RWG'].includes(pos))score+=x>60?160:-40}
return score+(p.ovr||0)*.28}
function optimal(ids,f){let pool=[...new Set(ids)].map(player).filter(Boolean).slice(0,11),positions=POS[f],n=pool.length,N=1<<n,dp=new Float64Array(N).fill(-1e12),path=new Array(N);dp[0]=0;for(let mask=0;mask<N;mask++){if(dp[mask]<-1e11)continue;let i=0,z=mask;while(z){i+=z&1;z>>=1}if(i>=11)continue;for(let j=0;j<n;j++){if(mask&(1<<j))continue;let next=mask|(1<<j),value=dp[mask]+slotScore(pool[j],positions[i]);if(value>dp[next]){dp[next]=value;path[next]=[mask,j]}}}let mask=N-1,slots=Array(11).fill(null);for(let i=n-1;i>=0;i--){let step=path[mask];if(!step)break;slots[i]=pool[step[1]].id;mask=step[0]}return slots}
function preset(f){let ids=g.lineup.filter(Boolean);g.lineup=optimal(ids,f);g.placements=POS[f].map(x=>x.slice());syncRoles()}
function hydrate(){g.formation=g.formation||'4-3-3';g.players.forEach((p,i)=>{p.positionXP=p.positionXP||{};p.role=p.role||(p.starter?'starter':i<18?'bench':'out');p.age=p.age||r(18,32);p.salary=p.salary||Math.max(500,Math.round(p.ovr*p.ovr*1.8));p.contract=p.contract||r(1,4);p.value=p.value||Math.round(p.ovr*p.ovr*12);p.mood=p.mood||r(70,98)});if(!g.lineup||!Array.isArray(g.lineup))g.lineup=g.players.filter(p=>p.role==='starter').slice(0,11).map(p=>p.id);if(g.lineup.length!==11||!g.placements||g.placements.length!==11){let ids=g.lineup.filter(Boolean);if(ids.length<11)ids=[...new Set([...ids,...g.players.filter(p=>p.role==='starter').map(p=>p.id)])].slice(0,11);g.lineup=optimal(ids,g.formation);g.placements=POS[g.formation].map(x=>x.slice())}syncRoles()}
function syncRoles(){let ids=new Set(g.lineup.filter(Boolean));g.players.forEach(p=>{if(ids.has(p.id))p.role='starter';else if(p.role==='starter')p.role='bench';p.starter=p.role==='starter'})}hydrate();const save=()=>localStorage.setItem(KEY,JSON.stringify(g)),yen=n=>n>=1e8?(n/1e8).toFixed(1)+'億':Math.floor(n/1e4)+'万',opp=()=>schedule[(g.week-1)%schedule.length],row=n=>g.table.find(x=>x.n===n),starters=()=>g.lineup.map(player).filter(Boolean);function teamPower(){let total=g.lineup.reduce((sum,id,i)=>{let p=player(id);return sum+(p?p.ovr*(fit(p,i)==='◎'?1:fit(p,i)==='○'?.93:.75):0)},0);return Math.round(total/11)}function oppPower(n){return Math.round(row(n)?.power||65)}function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('on',x.id===id));picked=null;render();scrollTo(0,0)}function render(){money.textContent=yen(g.money)+'円';fans.textContent=(g.fans||0).toLocaleString()+'人';season.textContent=`S${g.season} W${g.week}`;let me=row(MY)||{w:0,d:0,l:0},o=opp();heroText.textContent=`${me.w}勝 ${me.d}分 ${me.l}敗 ｜ チーム力 ${teamPower()} ｜ ${g.formation}`;bottom.innerHTML=navs.map(x=>`<button class="${document.getElementById(x[0]).classList.contains('on')?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');home.innerHTML=`<div class="card"><div class="strength"><div><b>${MY}</b><div class="num good">${teamPower()}</div></div><b>VS</b><div><b>${o}</b><div class="num">${oppPower(o)}</div></div></div><div class="modes"><button class="action" onclick="quickMatch()">⏭ スキップ</button><button class="action secondary" onclick="alert('視聴モードは試合エンジン改修中')">👀 視聴</button><button class="action secondary" onclick="alert('プレイモードは試合エンジンを作り直し中')">🎮 プレイ</button></div></div><h3>クラブニュース</h3><div class="card">${(g.logs||[]).slice(-6).reverse().join('<br>')}</div>`;players.innerHTML=squadHTML();league.innerHTML=leagueHTML();town.innerHTML=`<h3>クラブ経営</h3><div class="card">年間人件費 <b>${yen(g.players.reduce((a,p)=>a+(p.salary||0)*10000,0))}</b></div>`;scout.innerHTML=`<h3>移籍市場</h3><div class="card">移籍・契約システムは次段階で再接続します。</div>`;more.innerHTML=`<h3>その他</h3><div class="card"><b>開発者メニュー</b><div class="controls"><button class="mini" onclick="cash(1e8)">+1億</button><button class="mini" onclick="cash(1e9)">+10億</button><button class="mini" onclick="cash(1e10)">+100億</button></div></div>`}function setFormation(f){if(f===g.formation)return;if(confirm('新しいフォーメーションに11人を適正配置しますか？'))preset(f);g.formation=f;picked=null;save();render()}function repairLineup(){preset(g.formation);picked=null;save();render()}
function squadHTML(){return`<h3>チーム編成</h3><div class="formation">${Object.keys(POS).map(f=>`<button class="mini secondary ${g.formation===f?'on':''}" onclick="setFormation('${f}')">${f}</button>`).join('')}</div><div class="card"><div class="strength"><div><span class="meta">チーム総合</span><div class="num good">${teamPower()}</div></div><div>⚽</div><div><span class="meta">次節相手</span><div class="num">${oppPower(opp())}</div></div></div></div><div class="hint">①選手を選択 → ②ピッチの好きな場所をタップして移動</div><div class="moveMsg">${picked?`選択中：${player(picked)?.n||''}`:'◎本職 ○対応可能 △不慣れ'}</div><button class="mini secondary" style="margin-bottom:10px" onclick="repairLineup()">✨ 適正ポジションに自動整理</button><div class="squadTools"><button class="mini secondary" onclick="toggleLinks()">🔗 連携ライン</button><button class="mini secondary" onclick="picked!=null?openPlayer(picked):alert('選手を選択してください')">🪪 選手詳細</button></div><div class="chemStat">チーム連携 ${teamChemistry()} / 100</div>${boardHTML()}<div class="card" style="margin-top:10px"><b>🏋️ 個人トレーニング</b><p class="meta">12回練習で新しいポジションも◎に育ちます。</p><div class="trainingRow"><select id="trainPlayer">${g.players.map(p=>`<option value="${p.id}">${p.n}（${p.ovr}）</option>`).join('')}</select><select id="trainPos"><option value="gk">GK</option><option value="df">DF</option><option value="mf">MF</option><option value="fw">FW</option></select><button class="mini" onclick="trainPosition()">練習</button></div><p id="trainResult" class="meta"></p></div>`}function trainPosition(){let el=document.getElementById('trainPlayer'),sel=document.getElementById('trainPos');if(!el||!sel)return;let id=Number(el.value),b=sel.value,p=player(id);if(!p)return;p.positionXP=p.positionXP||{};p.positionXP[b]=(p.positionXP[b]||0)+1;p.ovr++;save();render();document.getElementById('trainPlayer').value=id;document.getElementById('trainPos').value=b;document.getElementById('trainResult').textContent=p.n+'：'+b.toUpperCase()+'経験 '+p.positionXP[b]+'/12、OVR +1'} function token(p,where){return`<div class="token ${band(p.pos)} ${picked===p.id?'selected':''}" onclick="playerTap(event,${p.id},'${where}')"><b>${p.ovr}</b><small>${p.n.split(' ')[0]}</small><small>${p.pos}</small></div>`}let showLinks=true;
function chemistry(a,b){if(!a||!b)return 0;return Math.round(65+(band(a.pos)===band(b.pos)?15:0)-Math.min(22,Math.abs(a.ovr-b.ovr)/5))}
function teamChemistry(){let ids=g.lineup.filter(Boolean),v=0,n=0;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){v+=chemistry(player(ids[i]),player(ids[j]));n++}return n?Math.round(v/n):0}
function linksHTML(){let out=[];for(let i=0;i<11;i++){let a=player(g.lineup[i]);if(!a)continue;let near=[];for(let j=0;j<11;j++){if(i===j||!player(g.lineup[j]))continue;let d=Math.hypot(g.placements[i][0]-g.placements[j][0],g.placements[i][1]-g.placements[j][1]);if(d<37)near.push([d,j])}near.sort((a,b)=>a[0]-b[0]);for(let pair of near.slice(0,3)){let j=pair[1];if(j<=i)continue;out.push('<line class="'+(chemistry(a,player(g.lineup[j]))>=75?'strong':'')+'" x1="'+g.placements[i][0]+'%" y1="'+g.placements[i][1]+'%" x2="'+g.placements[j][0]+'%" y2="'+g.placements[j][1]+'%"/>')}}return '<svg class="chemline">'+out.join('')+'</svg>'}
function toggleLinks(){showLinks=!showLinks;render()}
function closePlayer(){modal.classList.remove('on')}
function openPlayer(id,tab=0){let p=player(id);if(!p)return;let o=p.ovr;let tabs=['基本情報','能力','契約','実績'];let info=tab===0?'<p>ポジション '+p.pos+' ／ '+p.age+'歳</p><p>適性経験：'+Object.entries(p.positionXP||{}).map(x=>x[0].toUpperCase()+' '+x[1]+'/12').join(' ／ ')+'</p>':tab===1?'<div class="detailGrid">'+[['シュート',Math.round(o*.95)],['スピード',Math.round(o*.9)],['パス',Math.round(o*.85)],['ドリブル',Math.round(o*.92)],['フィジカル',Math.round(o*.87)],['守備',Math.round(o*.65)]].map(x=>'<div><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><p class="meta">個別能力は参考表示です。</p>':tab===2?'<p>年俸 '+yen((p.salary||0)*10000)+'</p><p>契約残 '+p.contract+'年</p><p>市場価値 '+yen((p.value||0)*10000)+'</p>':'<p>出場・得点記録は今後実装します。</p>';profile.innerHTML='<div class="profileCard"><button class="mini secondary" onclick="closePlayer()">← 戻る</button><div class="profileHero"><div class="portrait">⚽ '+o+'</div><div><h2>'+p.n+'</h2><p>札幌ノルディアFC</p><h1>'+o+' <small>'+p.pos+'</small></h1><p>才能 ★★★★☆</p></div></div><div class="squadTools">'+tabs.map((t,i)=>'<button class="mini '+(tab===i?'':'secondary')+'" onclick="openPlayer('+id+','+i+')">'+t+'</button>').join('')+'</div>'+info+'</div>';modal.classList.add('on')}
function boardHTML(){let bench=g.players.filter(p=>p.role==='bench'),out=g.players.filter(p=>p.role==='out');return `<div class="board"><div class="pitch" onclick="pitchTap(event)"><div class="attack">▲ ATTACK</div>${showLinks?linksHTML():''}${g.lineup.map((id,i)=>{let p=player(id),xy=g.placements[i];return p?`<div class="slot ${picked?'ready':''}" style="left:${xy[0]}%;top:${xy[1]}%" onclick="slotTap(event,${i})">${token(p,'slot:'+i)}<span class="fit">${fit(p,i)}</span></div>`:''}).join('')}</div><div class="side"><div class="pool" onclick="poolTap(event,'bench')"><h4>BENCH ＋</h4>${bench.map(p=>token(p,'bench')).join('')}</div><div class="pool" onclick="poolTap(event,'out')"><h4>OUT ＋</h4>${out.map(p=>token(p,'out')).join('')}</div></div></div>`}
function pitchTap(e){if(picked==null)return;let el=e.currentTarget,rect=el.getBoundingClientRect(),x=Math.max(10,Math.min(90,(e.clientX-rect.left)/rect.width*100)),y=Math.max(12,Math.min(91,(e.clientY-rect.top)/rect.height*100)),loc=locate(picked);if(loc.type==='slot'){g.placements[loc.i][0]=x;g.placements[loc.i][1]=y}else{let free=g.lineup.indexOf(null);if(free<0){alert('11人が配置済みです。入れ替える選手をタップしてください');return}g.lineup[free]=picked;player(picked).role='starter';g.placements[free]=[x,y,band(player(picked).pos)]}picked=null;syncRoles();save();render()}
function poolTap(e,role){e.stopPropagation();if(picked==null)return;let a=locate(picked),p=player(picked);if(a.type==='slot')g.lineup[a.i]=null;p.role=role;picked=null;syncRoles();save();render()}
function locate(id){let i=g.lineup.indexOf(id);if(i>=0)return{type:'slot',i};let p=player(id);return{type:p?.role||'out'}}function playerTap(e,id,where){e.stopPropagation();if(picked==null){picked=id;render();return}if(picked===id){openPlayer(id);return}swapPlayers(picked,id)}function slotTap(e,i){e.stopPropagation();if(!picked)return;let target=g.lineup[i];if(target)swapPlayers(picked,target);else moveToEmpty(picked,i)}function swapPlayers(aid,bid){let a=locate(aid),b=locate(bid),pa=player(aid),pb=player(bid);if(a.type==='slot'&&b.type==='slot'){[g.lineup[a.i],g.lineup[b.i]]=[g.lineup[b.i],g.lineup[a.i]]}else if(a.type==='slot'){g.lineup[a.i]=bid;pb.role='starter';pa.role=b.type}else if(b.type==='slot'){g.lineup[b.i]=aid;pa.role='starter';pb.role=a.type}else{let ar=pa.role;pa.role=pb.role;pb.role=ar}picked=null;syncRoles();save();render()}function moveToEmpty(id,i){let a=locate(id),p=player(id);if(a.type==='slot')g.lineup[a.i]=null;g.lineup[i]=id;p.role='starter';picked=null;syncRoles();save();render()}function leagueHTML(){let q=[...(g.table||[])].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));return`<h3>全国リーグ</h3><div class="card"><table class="table"><tr><th>#</th><th>クラブ</th><th>力</th><th>試</th><th>点</th></tr>${q.map((t,i)=>`<tr class="${t.n===MY?'me':t.n===RIVAL?'rival':''}"><td>${i+1}</td><td>${t.n}</td><td>${t.n===MY?teamPower():Math.round(t.power||65)}</td><td>${t.p}</td><td>${t.pts}</td></tr>`).join('')}</table></div>`}function result(t,a,b){if(!t)return;t.p++;t.gf+=a;t.ga+=b;if(a>b){t.w++;t.pts+=3}else if(a===b){t.d++;t.pts++}else t.l++}function quickMatch(){let o=opp(),edge=(teamPower()-oppPower(o))/18,a=Math.max(0,r(0,3)+Math.round(Math.max(0,edge)*Math.random())),b=Math.max(0,r(0,3)+Math.round(Math.max(0,-edge)*Math.random()));result(row(MY),a,b);result(row(o),b,a);g.logs=g.logs||[];g.logs.push(`${o}戦 ${a}-${b}`);g.week++;save();render()}function cash(n){g.money+=n;save();render()}render();</script></body></html>
