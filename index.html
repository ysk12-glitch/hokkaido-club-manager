nclick="tacticAuto()">✨ 自動編成</button><button class="mini secondary" onclick="tacticLinks=!tacticLinks;drawTactics()">🔗 連携</button><button class="mini" onclick="closeTactics()">編成を保存</button></div></div><div class="modal" id="modal"><div class="profile" id="profile"></div></div><script>const KEY='hcm-v02',MY='札幌ノルディアFC',RIVAL='旭川ヴァルク',schedule=['青森ブリザード','千葉オルカ',RIVAL,'仙台レグルス','横浜セイラーズ','新潟アルビオン','東京クロノス','鹿児島サザンクロス','名古屋グランツ','福岡アトラス','神戸ハーバーズ','広島レッドアロー','大阪フェニックス'];const navs=[['home','🏠','ホーム'],['players','👥','編成'],['league','🏆','リーグ'],['town','🏙️','街'],['scout','🔎','移籍'],['more','☰','その他']];let g=JSON.parse(localStorage.getItem(KEY)||'null'),picked=null,subtab='squad';const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));if(!g){alert('セーブデータがありません');throw 0}const POSITION_NAMES={GK:'ゴールキーパー',CB:'センターバック',LSB:'左サイドバック',RSB:'右サイドバック',LWB:'左ウイングバック',RWB:'右ウイングバック',DMF:'守備的MF',CMF:'中央MF',AMF:'攻撃的MF',LMF:'左サイドMF',RMF:'右サイドMF',CF:'センターフォワード',ST:'セカンドトップ',LWG:'左ウイング',RWG:'右ウイング',SB:'両サイドバック'};const POSITION_GROUPS={gk:['GK'],df:['CB','LSB','RSB','LWB','RWB','SB'],mf:['DMF','CMF','AMF','LMF','RMF'],fw:['CF','ST','LWG','RWG']};function normalizePosition(p){return({LB:'LSB',RB:'RSB',LW:'LWG',RW:'RWG'}[p]||p)}function positionArea(p){let q=standardPos(p),x=50,y=50,w=34,h=17;if(q==='GK'){y=91;w=30;h=12}else if(q==='CB'){y=75;w=48}else if(['LSB','LWB','LB'].includes(q)){x=17;y=q==='LWB'?58:75;w=29;h=q==='LWB'?36:17}else if(['RSB','RWB','RB'].includes(q)){x=83;y=q==='RWB'?58:75;w=29;h=q==='RWB'?36:17}else if(q==='SB'){y=75;w=95}else if(['DMF','DM'].includes(q)){y=62;w=42}else if(q==='CMF'){y=51;w=52;h=23}else if(['AMF','AM'].includes(q)){y=37;w=43}else if(['LMF','LM'].includes(q)){x=16;y=48;w=30;h=29}else if(['RMF','RM'].includes(q)){x=84;y=48;w=30;h=29}else if(q==='CF'){y=19;w=36}else if(q==='ST'){y=29;w=46}else if(['LWG','LW'].includes(q)){x=18;y=21;w=31;h=24}else if(['RWG','RW'].includes(q)){x=82;y=21;w=31;h=24}return {x,y,w,h}}function showPositionArea(id){let p=player(id);if(!p)return;document.querySelectorAll('.pitch,#tacticField').forEach(field=>{field.querySelectorAll('.preferredArea').forEach(el=>el.remove());let a=positionArea(p.pos),el=document.createElement('div');el.className='preferredArea';el.style.cssText='left:'+a.x+'%;top:'+a.y+'%;width:'+a.w+'%;height:'+a.h+'%';el.textContent='得意 '+p.pos;field.prepend(el)})}function clearPositionArea(){document.querySelectorAll('.preferredArea').forEach(el=>el.remove())}function changePlayerPosition(id,value){let p=player(id);if(!p||!SIMPLE_POS[value])return;p.pos=value;initIdentity(p);save();render();openPlayer(id)}function positionSelect(id,cur){return '<select onchange="changePlayerPosition('+id+',this.value)">'+Object.entries(SIMPLE_POS).map(([k,v])=>'<option value="'+k+'" '+(k===cur?'selected':'')+'>'+k+' '+v+'</option>').join('')+'</select>'}const SHORT_POS={LSB:'LB',RSB:'RB',LWG:'LW',RWG:'RW',AMF:'AM',DMF:'DM',LMF:'LM',RMF:'RM',ST:'CF',LWB:'LB',RWB:'RB',SB:'LB'};function standardPos(q){let p=normalizePosition(q);return SHORT_POS[p]||p}const SIMPLE_POS={GK:'ゴールキーパー',CB:'センターバック',LB:'左サイドバック',RB:'右サイドバック',DM:'守備的MF',CMF:'中央MF',AM:'攻撃的MF',LM:'左サイドMF',RM:'右サイドMF',CF:'センターフォワード',LW:'左ウイング',RW:'右ウイング'};const SKILL_POOL={gk:['守護神','PKストッパー'],df:['潰し屋','インターセプター','空中戦の覇者'],mf:['天才パサー','司令塔','ボックス・トゥ・ボックス','潰し屋'],fw:['ドリブラー','ゴールハンター','スピードスター','天才パサー']};function initIdentity(p){p.pos=standardPos(p.pos);p.positionXP=p.positionXP||{};p.aptitudes=p.aptitudes||{[p.pos]:3};p.aptitudes[p.pos]=Math.max(3,p.aptitudes[p.pos]||0);if(!p.attributes){let n=p.ovr||55,a=p.age||24;p.attributes={speed:Math.round(n*(a>32?.87:1)),physical:Math.round(n*.9),technique:Math.round(n*.95),vision:Math.round(n*(a>30?1.12:.7)),positioning:Math.round(n*(a>30?1.08:.72)),tactics:Math.round(n*(a>30?1.1:.68))}}if(!Array.isArray(p.skills)){let options=SKILL_POOL[band(p.pos)]||SKILL_POOL.mf;p.skills=[options[p.id%options.length]]}p.mastery=p.mastery||0}function growPlayer(p){initIdentity(p);let a=p.age||24,att=p.attributes,older=a>=29;att.vision+=older?2:1;att.positioning+=older?2:1;att.tactics+=older?2:1;if(a<28){att.speed+=1;att.physical+=1;att.technique+=1}else if(a<34){att.speed+=1;att.technique+=1;att.physical+=1}else{att.speed+=1;att.technique+=1;p.mastery+=1}if(p.mastery>=3&&!p.skills.includes('匠の戦術眼'))p.skills.push('匠の戦術眼');if(p.mastery>=6&&!p.skills.includes('ポジショニングの匠'))p.skills.push('ポジショニングの匠')}function skillBonus(p){if(!p)return 0;return Math.min(8,(p.skills||[]).length*1.5+((p.attributes?.vision||0)+(p.attributes?.positioning||0)+(p.attributes?.tactics||0))/240)}function aptitudeLabel(p){return Object.entries(p.aptitudes||{}).map(([k,v])=>k+' '+(v>=3?'◎':v>=2?'○':'△')).join(' / ')}function setAptitude(id,pos,value){let p=player(id);if(!p||!SIMPLE_POS[pos])return;p.aptitudes=p.aptitudes||{};if(pos===p.pos)return alert('本職は◎のままです');if(value===0)delete p.aptitudes[pos];else p.aptitudes[pos]=value;save();openPlayer(id)}function aptitudeEditor(p){return '<p>本職・得意・対応可能</p><div class="aptGrid">'+Object.keys(SIMPLE_POS).map(pos=>'<label>'+pos+'<select onchange="setAptitude('+p.id+',\''+pos+'\',Number(this.value))">'+[[0,'—'],[1,'△'],[2,'○'],[3,'◎']].map(([v,t])=>'<option value="'+v+'" '+((p.aptitudes?.[pos]||0)===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label>').join('')+'</div>'}function skillPanel(p){return '<p>✨ 特殊スキル：'+p.skills.join('・')+'</p><p>熟練度 '+p.mastery+' ／ 年齢 '+p.age+'歳</p><div class="detailGrid">'+Object.entries(p.attributes).map(([k,v])=>'<div><small>'+({speed:'スピード',physical:'フィジカル',technique:'技術',vision:'戦術眼',positioning:'位置取り',tactics:'戦術理解'}[k]||k)+'</small><b>'+v+'</b></div>').join('')+'</div>'}function player(id){return g.players.find(p=>p.id===id)}function band(p){let q=standardPos(p);if(q==='GK')return'gk';if(['CB','LB','RB'].includes(q))return'df';if(['CF','LW','RW'].includes(q))return'fw';return'mf'}const POS={
'4-3-3':[[50,91,'gk'],[13,73,'df'],[38,73,'df'],[63,73,'df'],[88,73,'df'],[25,52,'mf'],[50,52,'mf'],[75,52,'mf'],[17,20,'fw'],[50,18,'fw'],[83,20,'fw']],
'4-4-2':[[50,91,'gk'],[13,73,'df'],[38,73,'df'],[63,73,'df'],[88,73,'df'],[13,48,'mf'],[38,50,'mf'],[63,50,'mf'],[88,48,'mf'],[36,20,'fw'],[64,20,'fw']],
'3-4-2-1':[[50,91,'gk'],[25,74,'df'],[50,74,'df'],[75,74,'df'],[12,53,'mf'],[38,56,'mf'],[62,56,'mf'],[88,53,'mf'],[35,35,'mf'],[65,35,'mf'],[50,17,'fw']]};
function expected(i){return (g.placements?.[i]?.[2])||POS[g.formation][i]?.[2]||'mf'}
function fit(p,i){let a=band(p.pos),b=expected(i),xp=(p.positionXP||{})[b]||0;return a===b||xp>=12||Object.entries(p.aptitudes||{}).some(([k,v])=>v>=3&&band(k)===b)?'◎':xp>=5||Object.entries(p.aptitudes||{}).some(([k,v])=>v>=2&&band(k)===b)||(a==='mf'&&(b==='fw'||b==='df'))||(a==='fw'&&b==='mf')||(a==='df'&&b==='mf')?'○':'△'}
function slotScore(p,slot){let pos=p.pos||'',group=band(pos),want=slot[2],x=slot[0],y=slot[1],center=Math.abs(x-50),score=0;
if(want==='gk')score=group==='gk'?1000:-1000;
else if(want==='df'){score=group==='df'?500:group==='mf'?80:-250;if(pos==='CB')score+=center<20?85:0;if(['LB','LSB','LWB'].includes(pos))score+=x<40?100:-40;if(['RB','RSB','RWB'].includes(pos))score+=x>60?100:-40;if(pos==='SB')score+=center>15?70:20}
else if(want==='mf'){score=group==='mf'?460:group==='fw'?100:group==='df'?50:-500;let advanced=y<43,wide=center>25;if(['AMF','AM'].includes(pos))score+=advanced?160:-25;if(['DMF','DM'].includes(pos))score+=advanced?-90:110;if(pos==='CMF')score+=advanced?20:85;if(pos==='LW')score+=x<50&&wide?100:0;if(pos==='RW')score+=x>50&&wide?100:0}
else{score=group==='fw'?520:pos==='AMF'?130:-350;if(['CF','ST'].includes(pos))score+=center<22?160:20;if(['LW','LWG'].includes(pos))score+=x<40?160:-40;if(['RW','RWG'].includes(pos))score+=x>60?160:-40}
return score+(p.ovr||0)*.28}
function optimal(ids,f){let pool=[...new Set(ids)].map(player).filter(Boolean).slice(0,11),positions=POS[f],n=pool.length,N=1<<n,dp=new Float64Array(N).fill(-1e12),path=new Array(N);dp[0]=0;for(let mask=0;mask<N;mask++){if(dp[mask]<-1e11)continue;let i=0,z=mask;while(z){i+=z&1;z>>=1}if(i>=11)continue;for(let j=0;j<n;j++){if(mask&(1<<j))continue;let next=mask|(1<<j),value=dp[mask]+slotScore(pool[j],positions[i]);if(value>dp[next]){dp[next]=value;path[next]=[mask,j]}}}let mask=N-1,slots=Array(11).fill(null);for(let i=n-1;i>=0;i--){let step=path[mask];if(!step)break;slots[i]=pool[step[1]].id;mask=step[0]}return slots}
function preset(f){let ids=g.lineup.filter(Boolean);const goalies=g.players.filter(p=>p.pos==='GK').sort((a,b)=>b.ovr-a.ovr);if(goalies.length&&!ids.some(id=>player(id)?.pos==='GK')){const replace=ids.findIndex(id=>band(player(id)?.pos)==='fw');if(replace>=0)ids[replace]=goalies[0].id;else if(ids.length)ids[ids.length-1]=goalies[0].id;else ids.push(goalies[0].id)}ids=Array.from(new Set(ids));for(const p of g.players.slice().sort((a,b)=>b.ovr-a.ovr)){if(ids.length>=11)break;if(!ids.includes(p.id))ids.push(p.id)}g.lineup=optimal(ids,f);g.placements=POS[f].map(x=>x.slice());syncRoles()}
function hydrate(){g.formation=g.formation||'4-3-3';g.players.forEach((p,i)=>{p.pos=standardPos(p.pos);p.positionXP=p.positionXP||{};p.role=p.role||(p.starter?'starter':i<18?'bench':'out');p.age=p.age||r(18,32);p.salary=p.salary||Math.max(500,Math.round(p.ovr*p.ovr*1.8));p.contract=p.contract||r(1,4);p.value=p.value||Math.round(p.ovr*p.ovr*12);p.mood=p.mood||r(70,98);initIdentity(p)});if(!g.lineup||!Array.isArray(g.lineup))g.lineup=g.players.filter(p=>p.role==='starter').slice(0,11).map(p=>p.id);if(g.lineup.length!==11||!g.placements||g.placements.length!==11){let ids=g.lineup.filter(Boolean);if(ids.length<11)ids=[...new Set([...ids,...g.players.filter(p=>p.role==='starter').map(p=>p.id)])].slice(0,11);g.lineup=optimal(ids,g.formation);g.placements=POS[g.formation].map(x=>x.slice())}syncRoles()}
function lineupWarnings(){let ids=g.lineup.filter(id=>player(id)),issues=[];if(ids.length!==11)issues.push('スタメン '+ids.length+'/11人');let gk=g.lineup.map((id,i)=>({p:player(id),i})).find(x=>x.p?.pos==='GK');if(!gk)issues.push('GK不在');else if(expected(gk.i)!=='gk')issues.push('GKが本来の位置以外に配置');let mismatches=g.lineup.reduce((n,id,i)=>n+(player(id)&&fit(player(id),i)==='△'?1:0),0);if(mismatches)issues.push('適性不足 '+mismatches+'人');return issues}function lineupNotice(){let issues=lineupWarnings();return '<div class="lineupNotice '+(issues.length?'warn':'ok')+'">'+(issues.length?'⚠ '+issues.join(' ／ '):'✓ 11人配置・GK在籍')+'</div>'}function syncRoles(){let ids=new Set(g.lineup.filter(Boolean));g.players.forEach(p=>{if(ids.has(p.id))p.role='starter';else if(p.role==='starter')p.role='bench';p.starter=p.role==='starter'});let bench=g.players.filter(p=>p.role==='bench');if(bench.length>9){bench.slice(9).forEach(p=>p.role='out')}g.players.forEach(p=>p.starter=p.role==='starter')}hydrate();const save=()=>localStorage.setItem(KEY,JSON.stringify(g)),yen=n=>n>=1e8?(n/1e8).toFixed(1)+'億':Math.floor(n/1e4)+'万',opp=()=>schedule[(g.week-1)%schedule.length],row=n=>g.table.find(x=>x.n===n),starters=()=>g.lineup.map(player).filter(Boolean);function teamPower(){let total=g.lineup.reduce((sum,id,i)=>{let p=player(id);return sum+(p?p.ovr*(fit(p,i)==='◎'?1:fit(p,i)==='○'?.93:.75):0)},0);return Math.round(total/11)}function oppPower(n){return Math.round(row(n)?.power||65)}function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('on',x.id===id));picked=null;render();scrollTo(0,0)}function render(){money.textContent=yen(g.money)+'円';fans.textContent=(g.fans||0).toLocaleString()+'人';season.textContent=`S${g.season} W${g.week}`;let me=row(MY)||{w:0,d:0,l:0},o=opp();heroText.textContent=`${me.w}勝 ${me.d}分 ${me.l}敗 ｜ チーム力 ${teamPower()} ｜ ${g.formation}`;bottom.innerHTML=navs.map(x=>`<button class="${document.getElementById(x[0]).classList.contains('on')?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');home.innerHTML=`<div class="card"><div class="strength"><div><b>${MY}</b><div class="num good">${teamPower()}</div></div><b>VS</b><div><b>${o}</b><div class="num">${oppPower(o)}</div></div></div><div class="modes"><button class="action" onclick="quickMatch()">⏭ スキップ</button><button class="action secondary" onclick="start2D('watch')">👀 視聴</button><button class="action secondary" onclick="start2D('play')">🎮 プレイ</button></div></div><h3>クラブニュース</h3><div class="card">${(g.logs||[]).slice(-6).reverse().join('<br>')}</div>`;players.innerHTML=squadHTML();league.innerHTML=leagueHTML();town.innerHTML=`<h3>クラブ経営</h3><div class="card">年間人件費 <b>${yen(g.players.reduce((a,p)=>a+(p.salary||0)*10000,0))}</b></div>`;scout.innerHTML=transferHTML();more.innerHTML=`<h3>その他</h3><div class="card"><b>開発者メニュー</b><div class="controls"><button class="mini" onclick="cash(1e8)">+1億</button><button class="mini" onclick="cash(1e9)">+10億</button><button class="mini" onclick="cash(1e10)">+100億</button></div></div>`}function setFormation(f){if(f===g.formation)return;if(confirm('新しいフォーメーションに11人を適正配置しますか？'))preset(f);g.formation=f;picked=null;save();render()}function repairLineup(){preset(g.formation);picked=null;save();render()}
function squadHTML(){return`<h3>チーム編成</h3><div class="formation">${Object.keys(POS).map(f=>`<button class="mini secondary ${g.formation===f?'on':''}" onclick="setFormation('${f}')">${f}</button>`).join('')}</div><div class="card"><div class="strength"><div><span class="meta">チーム総合</span><div class="num good">${teamPower()}</div></div><div>⚽</div><div><span class="meta">次節相手</span><div class="num">${oppPower(opp())}</div></div></div></div><div class="hint">選手を掴んでドラッグ。重ねて交換・好きな位置へ配置</div><div class="moveMsg">${picked?`選択中：${player(picked)?.n||''}`:'◎本職 ○対応可能 △不慣れ'}</div><button class="mini secondary" style="margin-bottom:10px" onclick="repairLineup()">✨ 適正ポジションに自動整理</button><div class="squadTools"><button class="mini" onclick="openTactics()">🧠 戦術ボード</button><button class="mini secondary" onclick="toggleLinks()">🔗 連携ライン</button><button class="mini secondary" onclick="picked!=null?openPlayer(picked):alert('選手を選択してください')">🪪 選手詳細</button></div><div class="chemStat">チーム連携 ${teamChemistry()} / 100</div>${boardHTML()}<div class="card" style="margin-top:10px"><b>🏋️ ピッチ・ベンチから直接育成</b><p class="meta">選手を1回タップすると下に育成パネルが表示されます。ドラッグで配置変更、もう一度タップで詳細。</p>${picked?selectedTrainingHTML(): '<p class="meta">選手を選択してください</p>'}</div>`}function selectedTrainingHTML(){let p=player(picked);if(!p)return '';initIdentity(p);return '<div class="selectedTrain"><b>'+p.n+'　OVR '+p.ovr+'　'+p.pos+'</b><div class="meta">'+p.age+'歳 ｜ '+(p.skills||[]).join('・')+'</div><div class="controls"><button class="mini" onclick="trainDirect('+p.id+',\''+band(p.pos)+'\',true)">🏋️ 本職を練習</button><button class="mini secondary" onclick="openPlayer('+p.id+')">📋 詳細・適性</button><button class="mini secondary" onclick="moveToPool('+p.id+',\'bench\')">ベンチへ</button><button class="mini secondary" onclick="moveToPool('+p.id+',\'out\')">ベンチ外へ</button></div></div>'}function trainDirect(id,group,keepSelected=false){let p=player(id);if(!p)return;initIdentity(p);let b=group||band(p.pos);p.positionXP[b]=(p.positionXP[b]||0)+1;p.ovr++; function marketInit(){if(Array.isArray(g.market)&&g.market.length)return;let positions=['GK','CB','CB','LSB','RSB','DMF','CMF','AMF','LMF','RMF','CF','CF','LWG','RWG','ST'];let names=new Set(g.players.map(p=>p.n));g.market=[];g.marketNextId=Math.max(g.marketNextId||200000,200000,...g.players.map(p=>Number(p.id)||0));for(let i=0;i<18;i++){let p,name,country='日本';for(let tries=0;tries<100;tries++){let foreign=Math.random()<.22;if(foreign){country=pick(Object.keys(FOREIGN_NAMES));let pair=FOREIGN_NAMES[country];name=pick(pair[0])+' '+pick(pair[1])}else{country='日本';name=pick(JP_LAST)+' '+pick(JP_FIRST)}if(!names.has(name))break}names.add(name);let age=18+Math.floor(Math.random()*18),roll=Math.random(),ovr=roll<.07?91+Math.floor(Math.random()*17):roll<.27?74+Math.floor(Math.random()*17):48+Math.floor(Math.random()*27),pos=pick(positions);p={id:++g.marketNextId,n:name,pos,ovr,age,role:'out',salary:Math.round(ovr*ovr*1.8),contract:3,value:Math.round(ovr*ovr*12),mood:85,origin:country==='日本'?(Math.random()<.28?'国内ライバル':'国内リーグ'):country+'リーグ',nationality:country,skills:[],positionXP:{},aptitudes:{}};g.market.push(p)}save()}function transferInfo(p,owned){initIdentity(p);let attrs=p.attributes||{},names={speed:'スピード',physical:'フィジカル',technique:'技術',vision:'戦術眼',positioning:'位置取り',tactics:'戦術理解'};let club=owned?'札幌ノルディアFC':(p.club||p.origin||'所属クラブ未判明');return '<div class="meta">🏟 '+club+' ｜ '+(p.nationality||'日本')+' ｜ '+p.age+'歳</div><div class="meta">本職 '+p.pos+' ｜ OVR '+p.ovr+' ｜ '+(owned?(p.role==='starter'?'スタメン':p.role==='bench'?'ベンチ':'ベンチ外'):'獲得候補（未所属）')+'</div><div class="meta">適性 '+aptitudeLabel(p)+'</div><div class="meta">✨ '+(p.skills||[]).join('・')+'</div><div class="transferStats">'+Object.entries(names).map(([k,v])=>'<span>'+v+' <b>'+(attrs[k]??'—')+'</b></span>').join('')+'</div><div class="meta">年俸 '+yen((p.salary||0)*10000)+' ／ 契約残 '+(p.contract||'—')+'年</div><div class="meta">市場価値 '+yen((p.value||0)*10000)+(owned?' ／ 売却見込 '+yen(Math.round((p.value||0)*8000)):' ／ 獲得費用 '+yen((p.value||0)*10000))+'</div>'}
function transferCard(p,owned){return '<div class="transferRow"><div style="flex:1;min-width:0"><b>'+p.n+' <small>OVR '+p.ovr+' / '+p.pos+'</small></b><div class="meta">'+p.age+'歳 ｜ '+(owned?'札幌ノルディアFC':(p.club||p.origin||'所属不明'))+'</div><div class="meta">年俸 '+yen((p.salary||0)*10000)+' ｜ '+(owned?'売却見込 '+yen(Math.round((p.value||0)*8000)):'移籍金 '+yen((p.value||0)*10000))+'</div></div><button class="mini '+(owned?'secondary':'')+'" onclick="openTransferDetail('+p.id+','+owned+')">詳細</button></div>'}
function openTransferDetail(id,owned){let p=owned?player(id):g.market.find(x=>x.id===id);if(!p)return;let fee=owned?Math.round(p.value*8000):p.value*10000;modal.classList.add('on');profile.innerHTML='<div class="profileCard transferDetail"><button class="mini secondary" onclick="closePlayer()">← 移籍市場に戻る</button><h2>'+(owned?'📋 売却・契約確認':'🔎 スカウトレポート')+'</h2><h3>'+p.n+' <small>OVR '+p.ovr+'</small></h3>'+transferInfo(p,owned)+'<p class="meta">'+(owned?'この選手の売却見込額：':'獲得に必要な資金：')+yen(fee)+'</p><div class="transferActions">'+(owned?'<button class="action secondary" onclick="closePlayer();renewPlayer('+p.id+')">契約更新</button><button class="action danger" onclick="confirmSellPlayer('+p.id+')">売却を検討</button>':'<button class="action" onclick="signPlayer('+p.id+')">この選手を獲得</button>')+'</div></div>'}

>=90){m2.time=90;m2.paused=true;m2.finished=true;m2finished=true;m2notice='🏁 試合終了　札幌 '+m2.score[0]+' - '+m2.score[1]+' '+m2.enemy;document.getElementById('matchPause').textContent='✓ 閉じる'}}draw2D();let note=document.getElementById('matchNote');if(note)note.textContent=m2notice+'　｜　シュート数 札幌 '+m2.shots[0]+'本 / 相手 '+m2.shots[1]+'本（得点とは別）';m2raf=requestAnimationFrame(frame2D)};
</script></body></html>
