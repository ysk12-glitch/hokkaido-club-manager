<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>北海道クラブマネージャー</title><style>*{box-sizing:border-box}body{margin:0;background:#07131f;color:#eef5fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#0b2335,#07131f)}header{padding:18px 16px 12px;background:#0d2b40;border-bottom:1px solid #28506a}h1{font-size:22px;margin:0}.sub{font-size:11px;color:#8fb2c8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}.stat,.card{background:#102b3e;border:1px solid #244d67;border-radius:15px;padding:12px}.stat b{display:block;font-size:17px;color:#fff}.stat span{font-size:10px;color:#91b2c7}.hero{margin:0 12px 12px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#17435b,#14553e)}.hero h2{margin:0 0 5px;font-size:20px}.hero p{margin:0;color:#c5dce8;font-size:12px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 10px 12px;position:sticky;top:0;background:#07131fe8;z-index:4}.tabs button,button.action{border:0;border-radius:12px;padding:11px 4px;background:#18384d;color:#dbeaf2;font-weight:700}.tabs button.on{background:#2d8b63;color:white}main{padding:0 12px 90px}.section{display:none}.section.on{display:block}.player{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;margin-bottom:9px}.face{width:58px;height:66px;border-radius:12px;background:linear-gradient(145deg,#c6a37d,#5b382d);display:grid;place-items:center;font-size:30px;overflow:hidden}.name{font-weight:800}.meta{font-size:11px;color:#9db9c9}.ovr{font-size:24px;font-weight:900;color:#65d59c;text-align:right}.bar{height:6px;background:#071722;border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:#4fc58a}.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1}.action{background:#2d8b63!important;color:#fff!important}.danger{background:#814653!important}.match{font-size:25px;text-align:center;padding:22px 10px}.log{font-size:12px;line-height:1.7;color:#bfd0da;max-height:220px;overflow:auto}.facility{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.badge{font-size:10px;padding:3px 7px;border-radius:20px;background:#774fb4}.monster{border-color:#9c6cff;box-shadow:0 0 16px #7b42ff44}.monster .ovr{color:#bd92ff}footer{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;background:#0c2638dd;backdrop-filter:blur(12px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px}footer button{flex:1}</style></head><body><div class="app"><header><h1>⚽ 北海道クラブマネージャー</h1><div class="sub">HOKKAIDO FOOTBALL CLUB SIMULATION · v0.1</div></header><div class="stats"><div class="stat"><span>資金</span><b id="money"></b></div><div class="stat"><span>サポーター</span><b id="fans"></b></div><div class="stat"><span>シーズン</span><b id="season"></b></div></div><div class="hero"><h2>北海道ノースFC</h2><p id="heroText"></p></div><div class="tabs" id="tabs"></div><main><section id="home" class="section on"></section><section id="players" class="section"></section><section id="match" class="section"></section><section id="town" class="section"></section><section id="scout" class="section"></section></main><footer><button class="action" onclick="nextWeek()">▶ 1週間進める</button></footer></div><script>
const KEY='hcm-v01';const names=['佐藤 大輝','高橋 悠真','中村 海斗','伊藤 蓮','山本 陽翔','小林 蒼','加藤 湊','吉田 樹','山田 颯太','松本 悠斗','井上 朝陽','木村 陸','林 大和','斎藤 翼','清水 奏太','阿部 玲央','森 悠生','池田 新','橋本 碧','石川 凛'];const pos=['GK','CB','CB','LB','RB','DMF','CMF','CMF','AMF','RW','CF','GK','CB','SB','DMF','CMF','AMF','LW','CF','CF'];
function fresh(){return{season:1,week:1,money:300000000,fans:1820,w:0,d:0,l:0,goals:0,fac:{stadium:1,training:1,academy:1,station:1,shops:1},players:names.map((n,i)=>({id:i,n,pos:pos[i],age:18+i%14,ovr:45+Math.floor(Math.random()*28),xp:0,love:1+Math.floor(Math.random()*3),monster:false})),logs:['クラブが始動しました。北海道から頂点を目指そう。']}}let g;try{g=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){g=fresh()}function save(){localStorage.setItem(KEY,JSON.stringify(g))}const yen=n=>n>=1e8?(n/1e8).toFixed(1)+'億':Math.floor(n/1e4)+'万';const tabs=[['home','ホーム'],['players','選手'],['match','試合'],['town','街'],['scout','スカウト']];function nav(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.id===id))}function render(){money.textContent=yen(g.money)+'円';fans.textContent=g.fans.toLocaleString()+'人';season.textContent='S'+g.season+' W'+g.week;heroText.textContent=`${g.w}勝 ${g.d}分 ${g.l}敗 ｜ スタジアム ${3000*g.fac.stadium}席`;tabs.innerHTML=tabs.map((x,i)=>`<button data-id="${x[0]}" class="${i?'':'on'}" onclick="nav('${x[0]}')">${x[1]}</button>`).join('');home.innerHTML=`<div class="card"><b>📅 今週のクラブ</b><div class="match">北海道ノースFC<br><small>次節：北海ベアーズ</small></div><button class="action" onclick="playMatch()">⚽ 試合をする</button></div><h3>クラブニュース</h3><div class="card log">${g.logs.slice(-8).reverse().join('<br>')}</div>`;players.innerHTML='<h3>トップチーム</h3>'+g.players.sort((a,b)=>b.ovr-a.ovr).map(p=>`<div class="card player ${p.monster?'monster':''}"><div class="face">${p.monster?'⚡':'👤'}</div><div><div class="name">${p.n} ${p.monster?'<span class="badge">怪物</span>':''}</div><div class="meta">${p.pos}・${p.age}歳・クラブ愛★${p.love}</div><div class="bar"><i style="width:${Math.min(100,p.xp%100)}%"></i></div><div class="row"><button class="action" onclick="train(${p.id})">個人育成</button></div></div><div><div class="meta">総合</div><div class="ovr">${p.ovr}</div></div></div>`).join('');match.innerHTML=`<h3>リーグ戦</h3><div class="card match">${g.w} 勝　${g.d} 分　${g.l} 敗<br><small>得点 ${g.goals}</small></div><button class="action" onclick="playMatch()">次の試合へ</button>`;town.innerHTML='<h3>街づくり</h3>'+Object.entries({stadium:'🏟️ スタジアム',training:'🏋️ 練習場',academy:'🌱 アカデミー',station:'🚉 アクセス',shops:'🏪 商店街'}).map(([k,n])=>`<div class="card facility"><div><b>${n}</b><div class="meta">LEVEL ${g.fac[k]}</div></div><button class="action" onclick="upgrade('${k}')">改良 ${yen(g.fac[k]*20000000)}円</button></div>`).join('');scout.innerHTML=`<h3>スカウト</h3><div class="card"><b>全国・海外スカウト網</b><p class="meta">日本人を中心に、ときどき外国籍選手。そして極めて稀に「怪物」が見つかる。</p><button class="action" onclick="scoutOne()">🔎 500万円で探索</button></div>`}function train(id){let p=g.players.find(x=>x.id===id),cost=Math.max(1,Math.floor(p.ovr/50))*1000000;if(g.money<cost)return alert('資金が足りません');g.money-=cost;let gain=1+Math.floor(Math.random()*3)+(p.monster?2:0);p.xp+=18+Math.random()*30;if(p.xp>=100){gain+=Math.floor(p.xp/100);p.xp%=100}p.ovr+=gain;g.logs.push(`${p.n}が個人育成で総合${p.ovr}へ成長！`);save();render();nav('players')}function playMatch(){let avg=g.players.slice(0,11).reduce((s,p)=>s+p.ovr,0)/11,opp=55+g.season*2+Math.random()*25,us=Math.max(0,Math.floor(Math.random()*4+(avg-opp)/22)),them=Math.max(0,Math.floor(Math.random()*3+(opp-avg)/28));if(us>them)g.w++;else if(us===them)g.d++;else g.l++;g.goals+=us;let att=Math.min(3000*g.fac.stadium,Math.floor(g.fans*(.45+Math.random()*.35)));let income=att*2200;g.money+=income;if(us>them)g.fans+=60+Math.floor(Math.random()*120)+g.fac.shops*10;else if(us<them)g.fans=Math.max(300,g.fans-20);g.players.forEach(p=>{p.xp+=5+Math.random()*10;if(p.xp>=100){p.ovr++;p.xp-=100}});g.logs.push(`⚽ ${us}-${them} ${us>them?'勝利！':us===them?'引き分け':'敗戦'} 観客${att.toLocaleString()}人`);nextWeek(false);alert(`試合終了\n北海道ノースFC ${us} - ${them} 北海ベアーズ\n観客 ${att.toLocaleString()}人`)}function upgrade(k){let c=g.fac[k]*20000000;if(g.money<c)return alert('資金が足りません');g.money-=c;g.fac[k]++;if(k==='station'||k==='shops')g.fans+=250*g.fac[k];g.logs.push(`${k==='stadium'?'スタジアム':'街の施設'}がLEVEL ${g.fac[k]}になった。`);save();render();nav('town')}function scoutOne(){if(g.money<5000000)return alert('資金が足りません');g.money-=5000000;let foreign=Math.random()<.22,monster=Math.random()<.025;let first=foreign?['Lucas','Mateus','Kim','Park','Léo','Noah'][Math.floor(Math.random()*6)]:['神谷','北村','橘','黒田','白石','三浦'][Math.floor(Math.random()*6)],last=foreign?[' Silva',' Costa',' Min-jun',' Joon',' Santos',' Müller'][Math.floor(Math.random()*6)]:[' 蓮',' 海',' 岳',' 凪',' 翼',' 迅'][Math.floor(Math.random()*6)];let p={id:Date.now(),n:first+last,pos:['CF','AMF','CMF','CB','GK'][Math.floor(Math.random()*5)],age:16+Math.floor(Math.random()*15),ovr:monster?105+Math.floor(Math.random()*55):48+Math.floor(Math.random()*40),xp:0,love:1,monster};g.players.push(p);g.logs.push(`🔎 ${monster?'【怪物発見】':''}${p.n}（総合${p.ovr}）を獲得！`);save();render();nav('scout');alert(`${monster?'⚡ 怪物発見！\n':''}${p.n}\n${p.pos} / ${p.age}歳 / 総合 ${p.ovr}`)}function nextWeek(draw=true){g.week++;if(g.week>34){g.season++;g.week=1;g.w=g.d=g.l=g.goals=0;g.money+=50000000;g.logs.push(`🎉 シーズン${g.season}開幕。クラブ運営金5000万円を獲得。`)}save();render();if(draw)nav('home')}render();</script></body></html>
