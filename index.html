<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>札幌ノルディアFC</title><style>*{box-sizing:border-box}body{margin:0;background:#06131e;color:#eef7fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#0b2435,#06131e)}header{padding:13px 14px 8px;background:#0b2639}h1{font-size:20px;margin:0}.sub,.meta{font-size:11px;color:#9eb8c8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px}.stat,.card{background:#102b3e;border:1px solid #28516a;border-radius:15px;padding:12px}.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:#91b2c7}.hero{margin:0 9px 10px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#17465e,#175b43)}.hero h2{margin:0 0 3px;font-size:21px}main{padding:0 11px 105px}.section{display:none}.section.on{display:block}.action,.mini{border:0;border-radius:11px;padding:10px;background:#2f9669;color:white;font-weight:800}.mini{padding:7px 9px}.secondary{background:#29495e}.match{text-align:center;font-size:21px;padding:15px 5px}.derby{border-color:#efad42;box-shadow:0 0 18px #e7a53b33}.derbyTitle{color:#ffc461;font-weight:900}.log{font-size:12px;line-height:1.7;color:#c0d3de}.player{display:grid;grid-template-columns:62px 1fr auto;gap:9px;align-items:center;margin-bottom:8px}.portrait{width:62px;height:72px;border-radius:11px;background:linear-gradient(160deg,#a9bbc5 0 38%,#d3a681 39% 61%,#17486a 62%);position:relative;overflow:hidden}.portrait:before{content:'';position:absolute;width:29px;height:34px;border-radius:48%;background:#d5aa87;left:17px;top:13px;box-shadow:0 -7px 0 #29221f}.portrait:after{content:'';position:absolute;width:52px;height:35px;border-radius:45% 45% 0 0;background:#1d6c50;left:5px;top:50px}.monster{border-color:#9d72ff}.monster .portrait{box-shadow:0 0 16px #9c6cff99}.name{font-weight:800}.ovr{font-size:24px;font-weight:900;color:#6bdfa5}.badge,.trait{font-size:9px;padding:3px 6px;border-radius:12px;background:#754eb0;display:inline-block;margin:2px}.trait{background:#244c63}.bar{height:5px;background:#071722;border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#4fc58a}.table{width:100%;border-collapse:collapse;font-size:11px}.table td,.table th{padding:7px 3px;border-bottom:1px solid #24465a;text-align:center}.table td:nth-child(2),.table th:nth-child(2){text-align:left}.me{color:#6bdfa5;font-weight:900}.rival{color:#ffc461}.facility{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;background:#0b2233f2;backdrop-filter:blur(12px);padding:7px 6px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);z-index:20}.bottom button{border:0;background:none;color:#9fb7c7;font-size:9px;padding:6px 0}.bottom b{display:block;font-size:19px}.bottom .on{color:#6be0a3}.modal{display:none;position:fixed;inset:0;background:#020a10ed;z-index:50;padding:calc(22px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));overflow:auto}.modal.on{display:block}.profile{max-width:560px;margin:auto}.profileHero{display:grid;grid-template-columns:105px 1fr;gap:13px;align-items:end;background:linear-gradient(145deg,#173f55,#10283a);padding:14px;border-radius:20px}.bigPortrait{width:105px;height:125px}.bigOvr{font-size:46px;font-weight:900;color:#6bdfa5}.ability{display:grid;grid-template-columns:1fr auto;gap:5px;font-size:12px;margin:8px 0}.abilitybar{grid-column:1/3;height:5px;background:#081923;border-radius:8px;overflow:hidden}.abilitybar i{display:block;height:100%;background:#4fc58a}.focus{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.focus button{font-size:10px}.formation{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.formation button.on{background:#2f9669}.pitch{background:linear-gradient(#17603f,#115234);border:2px solid #d6eadb88;border-radius:18px;padding:14px 8px;min-height:420px;display:flex;flex-direction:column;justify-content:space-around}.line{display:flex;justify-content:space-around;gap:4px}.shirt{width:70px;text-align:center;font-size:9px}.shirt b{display:grid;place-items:center;width:38px;height:38px;margin:auto;border-radius:50% 50% 35% 35%;background:#e9f1f4;color:#123;font-size:10px;border:2px solid #67d4a0}.commentary{height:280px;overflow:auto;background:#061722;border-radius:14px;padding:10px;font-size:12px;line-height:1.8}.goal{color:#71e3a9;font-weight:900;font-size:15px}.event{border-bottom:1px solid #1b3a4d;padding:4px}.townmap{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.building{min-height:110px;background:linear-gradient(145deg,#15384c,#102a3b);border:1px solid #2a536a;border-radius:15px;padding:12px}.building .ico{font-size:30px}.scoutCard{text-align:center;padding:20px}.scoutCard .portrait{margin:auto;width:100px;height:118px}.close{width:100%;margin-top:10px;background:#30485a}.history{font-size:11px;line-height:1.7;color:#bdd0da}.score{font-size:35px;font-weight:900}</style></head><body><div class="app"><header><h1>⚽ 北海道クラブマネージャー</h1><div class="sub">CLUB LEGACY · v0.4</div></header><div class="stats"><div class="stat"><span>資金</span><b id="money"></b></div><div class="stat"><span>サポーター</span><b id="fans"></b></div><div class="stat"><span>シーズン</span><b id="season"></b></div></div><div class="hero"><h2>札幌ノルディアFC</h2><div id="heroText" class="meta"></div></div><main><section id="home" class="section on"></section><section id="players" class="section"></section><section id="league" class="section"></section><section id="town" class="section"></section><section id="scout" class="section"></section><section id="more" class="section"></section></main><nav class="bottom" id="bottom"></nav></div><div class="modal" id="modal"><div class="profile" id="profile"></div></div><script>
const KEY='hcm-v02',MY='札幌ノルディアFC',RIVAL='旭川ヴァルク';const clubs=[MY,RIVAL,'青森ブリザード','仙台レグルス','新潟アルビオン','千葉オルカ','東京クロノス','横浜セイラーズ','名古屋グランツ','大阪フェニックス','神戸ハーバーズ','広島レッドアロー','福岡アトラス','鹿児島サザンクロス'];const schedule=['青森ブリザード','千葉オルカ',RIVAL,'仙台レグルス','横浜セイラーズ','新潟アルビオン','東京クロノス','鹿児島サザンクロス','名古屋グランツ','福岡アトラス','神戸ハーバーズ','広島レッドアロー','大阪フェニックス'];const labels={shot:'シュート',pass:'パス',dribble:'ドリブル',defense:'守備',speed:'スピード',physical:'フィジカル',stamina:'スタミナ',mental:'メンタル'};const navs=[['home','🏠','ホーム'],['players','👥','選手'],['league','🏆','リーグ'],['town','🏙️','街'],['scout','🔎','発掘'],['more','☰','その他']];const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));let g;try{g=JSON.parse(localStorage.getItem(KEY))}catch(e){};if(!g)location.reload();function hydrate(){g.formation=g.formation||'4-3-3';g.derbyHistory=g.derbyHistory||{w:0,d:0,l:0};g.pendingScout=null;g.players.forEach((p,i)=>{p.starter=p.starter??i<11;p.history=p.history||[];p.traits=p.traits||['クラブ愛'];p.ab=p.ab||Object.fromEntries(Object.keys(labels).map(k=>[k,p.ovr+r(-7,7)]));p.nationality=p.nationality||'日本';p.foot=p.foot||(['右','右','左'][i%3]);p.height=p.height||r(166,190)})}hydrate();const save=()=>localStorage.setItem(KEY,JSON.stringify(g));const yen=n=>n>=1e8?(n/1e8).toFixed(1)+'億':Math.floor(n/1e4)+'万';const row=n=>g.table.find(x=>x.n===n);const ranking=()=>[...g.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));const opp=()=>schedule[(g.week-1)%schedule.length];function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('on',x.id===id));render();scrollTo(0,0)}function starters(){let s=g.players.filter(p=>p.starter);if(s.length<11)s=[...g.players].sort((a,b)=>b.ovr-a.ovr).slice(0,11);return s.slice(0,11)}function render(){money.textContent=yen(g.money)+'円';fans.textContent=g.fans.toLocaleString()+'人';season.textContent=`S${g.season} W${g.week}`;let me=row(MY);heroText.textContent=`${me.w}勝 ${me.d}分 ${me.l}敗 ｜ ${ranking().findIndex(x=>x.n===MY)+1}位 ｜ ${g.formation}`;bottom.innerHTML=navs.map(x=>`<button data-id="${x[0]}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on',document.getElementById(x.dataset.id).classList.contains('on')));let o=opp(),d=o===RIVAL;home.innerHTML=`<div class="card ${d?'derby':''}">${d?'<div class="derbyTitle">🔥 北海ダービー</div>':''}<div class="match"><b>${MY}</b><br><small>第${g.week}節 VS</small><br><b>${o}</b></div><button class="action" style="width:100%" onclick="startMatch()">⚽ 試合へ</button></div><h3>クラブニュース</h3><div class="card log">${g.logs.slice(-8).reverse().join('<br>')}</div>`;players.innerHTML=`<h3>選手・スタメン</h3><div class="formation">${['4-3-3','4-4-2','3-4-2-1'].map(f=>`<button class="mini secondary ${g.formation===f?'on':''}" onclick="setFormation('${f}')">${f}</button>`).join('')}</div><div class="card meta" style="margin-bottom:8px">スタメンは選手詳細から変更できます。現在 ${g.players.filter(p=>p.starter).length}/11人</div>`+[...g.players].sort((a,b)=>(b.starter-a.starter)||b.ovr-a.ovr).map(p=>`<div class="card player ${p.monster?'monster':''}" onclick="openPlayer(${p.id})"><div class="portrait"></div><div><div class="name">${p.starter?'🟢 ':''}${p.n} ${p.monster?'<span class="badge">怪物</span>':''}</div><div class="meta">${p.pos}・${p.age}歳・${p.nationality}</div><div>${p.traits.slice(0,2).map(t=>`<span class="trait">${t}</span>`).join('')}</div><div class="bar"><i style="width:${p.xp%100}%"></i></div></div><div class="ovr">${p.ovr}</div></div>`).join('');league.innerHTML=`<h3>全国リーグ</h3><div class="card"><table class="table"><tr><th>#</th><th>クラブ</th><th>試</th><th>点</th><th>差</th></tr>${ranking().map((t,i)=>`<tr class="${t.n===MY?'me':t.n===RIVAL?'rival':''}"><td>${i+1}</td><td>${t.n}${t.n===RIVAL?' 🔥':''}</td><td>${t.p}</td><td>${t.pts}</td><td>${t.gf-t.ga}</td></tr>`).join('')}</table></div><div class="card" style="margin-top:9px"><b>🔥 北海ダービー通算</b><p>${g.derbyHistory.w}勝 ${g.derbyHistory.d}分 ${g.derbyHistory.l}敗</p></div>`;let fs={stadium:['🏟️','スタジアム','収容人数と興行収入'],training:['🏋️','トレーニングセンター','育成効率'],academy:['🌱','ユースアカデミー','若手発掘'],station:['🚉','ノルディア駅','観客アクセス'],shops:['🏪','ノルディアタウン','人気・試合日収入']};town.innerHTML=`<h3>ノルディアタウン</h3><div class="townmap">${Object.entries(fs).map(([k,v])=>`<div class="building"><div class="ico">${v[0]}</div><b>${v[1]}</b><div class="meta">Lv.${g.fac[k]}｜${v[2]}</div><button class="mini" style="margin-top:10px" onclick="upgrade('${k}')">改良 ${yen(g.fac[k]*2e7)}</button></div>`).join('')}</div>`;scout.innerHTML=`<h3>スカウトセンター</h3><div class="card"><b>探索地域</b><p class="meta">国内 500万円 / 南米 1000万円 / 欧州 1500万円</p><div class="focus"><button class="action" onclick="scoutFind('jp',5e6)">🇯🇵 国内</button><button class="action" onclick="scoutFind('sa',1e7)">🌎 南米</button><button class="action" onclick="scoutFind('eu',1.5e7)">🇪🇺 欧州</button></div></div>`;more.innerHTML=`<h3>クラブ記録</h3><div class="card"><b>${MY}</b><p class="meta">宿敵：${RIVAL}<br>スタジアム：${g.fac.stadium*3000}席<br>トップチーム：${g.players.length}名</p></div>`}function setFormation(f){g.formation=f;save();render()}function openPlayer(id){let p=g.players.find(x=>x.id===id);let canStart=p.starter||g.players.filter(x=>x.starter).length<11;profile.innerHTML=`<div class="profileHero ${p.monster?'monster':''}"><div class="portrait bigPortrait"></div><div><div class="meta">${p.nationality} / ${p.pos} / ${p.age}歳</div><h2>${p.n}</h2><div class="bigOvr">${p.ovr}</div><div class="meta">${p.height}cm・${p.foot}利き</div></div></div><div class="card" style="margin-top:9px">${Object.entries(p.ab).map(([k,v])=>`<div class="ability"><span>${labels[k]}</span><b>${v}</b><div class="abilitybar"><i style="width:${Math.min(100,v)}%"></i></div></div>`).join('')}</div><div class="card" style="margin-top:9px"><b>育成</b><div class="focus">${['shot','pass','speed','defense','physical','mental'].map(k=>`<button class="mini" onclick="train(${p.id},'${k}')">${labels[k]}</button>`).join('')}</div><button class="action" style="width:100%;margin-top:7px" onclick="train(${p.id},'all')">総合トレーニング</button></div><button class="action" style="width:100%;margin-top:9px" ${canStart?'':'disabled'} onclick="toggleStarter(${p.id})">${p.starter?'🔴 スタメンから外す':'🟢 スタメンにする'}</button><div class="card history" style="margin-top:9px"><b>成長履歴</b><br>${p.history.slice(-6).reverse().join('<br>')||'まだ記録はありません'}</div><button class="action close" onclick="modal.classList.remove('on')">閉じる</button>`;modal.classList.add('on')}function toggleStarter(id){let p=g.players.find(x=>x.id===id);if(!p.starter&&g.players.filter(x=>x.starter).length>=11)return alert('スタメンは11人です。先に1人外してください');p.starter=!p.starter;save();modal.classList.remove('on');render()}function train(id,k){let p=g.players.find(x=>x.id===id),cost=Math.max(1,Math.floor(p.ovr/60))*1e6;if(g.money<cost)return alert('資金不足');g.money-=cost;let boost=1+Math.floor(g.fac.training/2)+(p.monster?2:0);if(k==='all')Object.keys(p.ab).forEach(a=>p.ab[a]+=r(0,boost));else p.ab[k]+=r(2,4+boost);p.ovr=Math.round(Object.values(p.ab).reduce((a,b)=>a+b,0)/8);p.history.push(`S${g.season}W${g.week} ${k==='all'?'総合':labels[k]}強化 → 総合${p.ovr}`);save();openPlayer(id);render()}function startMatch(){let o=opp(),d=o===RIVAL,s=starters(),avg=s.reduce((a,p)=>a+p.ovr,0)/s.length,ot=row(o),events=[],us=0,them=0;for(let min=5;min<90;min+=r(5,12)){let our=Math.random()<(avg/(avg+ot.power));if(Math.random()<.28){if(our){us++;let scorer=s[r(0,s.length-1)];events.push(`<div class="event goal">${min}' ⚽ GOAL! ${scorer.n}</div>`)}else{them++;events.push(`<div class="event">${min}' ⚽ ${o}が得点</div>`)}}else events.push(`<div class="event">${min}' ${our?'ノルディアがチャンスを作る':'相手の攻撃をしのぐ'}</div>`)}profile.innerHTML=`<div class="card ${d?'derby':''}"><div class="${d?'derbyTitle':''}">${d?'🔥 北海ダービー':'リーグ第'+g.week+'節'}</div><div class="match"><b>${MY}</b><div class="score">${us} - ${them}</div><b>${o}</b></div><div class="commentary">${events.join('')}</div><button class="action" style="width:100%;margin-top:10px" onclick="finishMatch('${o}',${us},${them},${d})">試合終了 →</button></div>`;modal.classList.add('on')}function result(t,a,b){t.p++;t.gf+=a;t.ga+=b;if(a>b){t.w++;t.pts+=3}else if(a===b){t.d++;t.pts++}else t.l++}function finishMatch(o,us,them,d){let me=row(MY),ot=row(o);result(me,us,them);result(ot,them,us);let others=g.table.filter(x=>x.n!==MY&&x.n!==o);for(let i=0;i+1<others.length;i+=2){let a=r(0,3),b=r(0,3);result(others[i],a,b);result(others[i+1],b,a)}let att=Math.min(g.fac.stadium*3000,Math.floor(g.fans*(d?1.3:.6+Math.random()*.3)));g.money+=att*2200*(1+g.fac.shops*.08);if(us>them)g.fans+=r(80,180)+(d?200:0);if(d){if(us>them)g.derbyHistory.w++;else if(us===them)g.derbyHistory.d++;else g.derbyHistory.l++}starters().forEach(p=>{p.xp+=r(7,15);if(p.xp>=100){p.xp-=100;p.ab.mental++;p.ovr=Math.round(Object.values(p.ab).reduce((a,b)=>a+b,0)/8)}});g.logs.push(`${d?'🔥 北海ダービー ':''}${o}戦 ${us}-${them}｜観客${att.toLocaleString()}人`);modal.classList.remove('on');advance()}function advance(){g.week++;if(g.week>26){let place=ranking().findIndex(x=>x.n===MY)+1;g.season++;g.week=1;g.money+=place<=3?1.2e8:5e7;g.players.forEach(p=>p.age++);g.table=clubs.map((n,i)=>({n,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,power:52+i*2+g.season+r(0,8)}));g.logs.push(`🏁 シーズン終了 ${place}位。S${g.season}開幕！`)}save();render();go('home')}function upgrade(k){let c=g.fac[k]*2e7;if(g.money<c)return alert('資金不足');g.money-=c;g.fac[k]++;if(k==='station'||k==='shops')g.fans+=g.fac[k]*300;g.logs.push(`🏙️ ${k}がLv.${g.fac[k]}へ発展`);save();render()}function scoutFind(area,cost){if(g.money<cost)return alert('資金不足');g.money-=cost;let foreign=area!=='jp',monster=Math.random()<(area==='sa'?.05:area==='eu'?.04:.025),jp1=['神谷','北村','橘','黒田','白石','三浦','相馬','藤原'],jp2=['蓮','海','岳','凪','翼','迅','颯','悠真'],fn=area==='sa'?['Lucas','Mateus','Rafael','Thiago','João']:['Noah','Lukas','Theo','Emil','Leo'],ln=area==='sa'?[' Silva',' Costa',' Santos',' Lima',' Alves']:[' Müller',' Rossi',' Novak',' Jensen',' Martin'],n=foreign?fn[r(0,fn.length-1)]+ln[r(0,ln.length-1)]:jp1[r(0,jp1.length-1)]+' '+jp2[r(0,jp2.length-1)],o=monster?r(82,115):r(48,82),p={id:Date.now(),n,pos:['CF','AMF','CMF','CB','GK'][r(0,4)],age:r(16,27),ovr:o,xp:0,love:1,monster,nationality:area==='jp'?'日本':area==='sa'?'ブラジル':'欧州',foot:Math.random()<.25?'左':'右',height:r(168,194),starter:false,traits:[monster?'規格外の才能':['裏抜け◎','パサー','鉄人','対人守備◎','スピードスター'][r(0,4)]],history:[],ab:Object.fromEntries(Object.keys(labels).map(k=>[k,o+r(-9,9)]))};g.pendingScout=p;save();profile.innerHTML=`<div class="card scoutCard ${monster?'monster':''}"><div class="portrait"></div><h2>${monster?'⚡ ':''}${p.n}</h2><div class="bigOvr">${p.ovr}</div><p>${p.nationality} / ${p.pos} / ${p.age}歳<br>${p.traits[0]}</p><button class="action" onclick="signScout()">契約する</button><button class="action close" onclick="modal.classList.remove('on')">見送る</button></div>`;modal.classList.add('on');render()}function signScout(){if(!g.pendingScout)return;g.players.push(g.pendingScout);g.logs.push(`🔎 ${g.pendingScout.n}と契約！${g.pendingScout.monster?' ⚡怪物候補':''}`);g.pendingScout=null;save();modal.classList.remove('on');render();go('players')}render();</script></body></html>
