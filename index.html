<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>札幌ノルディアFC</title><style>*{box-sizing:border-box}body{margin:0;background:#06131e;color:#eef7fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(#0b2435,#06131e)}header{padding:13px 14px 8px;background:#0b2639}h1{font-size:20px;margin:0}.sub,.meta{font-size:11px;color:#9eb8c8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px}.stat,.card{background:#102b3e;border:1px solid #28516a;border-radius:15px;padding:12px}.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:#91b2c7}.hero{margin:0 9px 10px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#17465e,#175b43)}.hero h2{margin:0 0 3px;font-size:21px}main{padding:0 11px 105px}.section{display:none}.section.on{display:block}.action,.mini{border:0;border-radius:11px;padding:10px;background:#2f9669;color:white;font-weight:800}.mini{padding:7px 9px}.secondary{background:#29495e}.danger{background:#7b4050}.match{text-align:center;font-size:21px;padding:15px 5px}.derby{border-color:#efad42;box-shadow:0 0 18px #e7a53b33}.derbyTitle{color:#ffc461;font-weight:900}.log{font-size:12px;line-height:1.7;color:#c0d3de}.player{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:7px}.name{font-weight:800}.ovr{font-size:24px;font-weight:900;color:#6bdfa5}.badge{font-size:9px;padding:3px 6px;border-radius:12px;background:#754eb0}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;background:#0b2233f2;backdrop-filter:blur(12px);padding:7px 6px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);z-index:20}.bottom button{border:0;background:none;color:#9fb7c7;font-size:9px;padding:6px 0}.bottom b{display:block;font-size:19px}.bottom .on{color:#6be0a3}.pitch{position:relative;height:510px;background:repeating-linear-gradient(0deg,#17613f 0 51px,#155a3b 51px 102px);border:2px solid #d9f0df99;border-radius:18px;margin:10px 0;overflow:hidden}.pitch:before{content:'';position:absolute;inset:8px;border:1px solid #fff8;border-radius:4px}.pitch:after{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px solid #fff8}.spot{position:absolute;transform:translate(-50%,-50%);width:72px;text-align:center;z-index:2}.shirt{width:38px;height:38px;margin:auto;border-radius:50% 50% 35% 35%;display:grid;place-items:center;background:#eef6f8;color:#123;border:2px solid #66d7a0;font-size:10px;font-weight:900}.spot small{display:block;font-size:9px;background:#071722cc;border-radius:7px;padding:2px;margin-top:2px}.squadTabs,.formation,.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.squadTabs button.on,.formation button.on{background:#2f9669}.strength{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.strength .num{font-size:36px;font-weight:900}.good{color:#6bdfa5}.bad{color:#ff9b9b}.meter{height:9px;background:#071722;border-radius:9px;overflow:hidden;margin:5px 0}.meter i{display:block;height:100%;background:#4fc58a}.table{width:100%;border-collapse:collapse;font-size:11px}.table td,.table th{padding:7px 3px;border-bottom:1px solid #24465a;text-align:center}.table td:nth-child(2),.table th:nth-child(2){text-align:left}.me{color:#6bdfa5;font-weight:900}.rival{color:#ffc461}.modal{display:none;position:fixed;inset:0;background:#020a10ed;z-index:50;padding:calc(22px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));overflow:auto}.modal.on{display:block}.profile{max-width:560px;margin:auto}.commentary{height:280px;overflow:auto;background:#061722;border-radius:14px;padding:10px;font-size:12px;line-height:1.8}.event{border-bottom:1px solid #1b3a4d;padding:5px}.goal{color:#71e3a9;font-weight:900}.score{font-size:38px;font-weight:900}.playfield{height:280px;background:#17603f;border-radius:15px;position:relative;overflow:hidden;border:2px solid #d6eadb88}.ball{position:absolute;width:18px;height:18px;border-radius:50%;background:white;color:#111;display:grid;place-items:center;font-size:12px;transition:.5s}.dot{position:absolute;width:23px;height:23px;border-radius:50%;background:#eaf3f5;border:2px solid #63d49d;color:#123;font-size:8px;display:grid;place-items:center}.dot.opp{background:#d96b68;border-color:#ffaaa7}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.hidden{display:none!important}.close{width:100%;margin-top:10px;background:#30485a}</style></head><body><div class="app"><header><h1>⚽ 北海道クラブマネージャー</h1><div class="sub">CLUB LEGACY · v0.5</div></header><div class="stats"><div class="stat"><span>資金</span><b id="money"></b></div><div class="stat"><span>サポーター</span><b id="fans"></b></div><div class="stat"><span>シーズン</span><b id="season"></b></div></div><div class="hero"><h2>札幌ノルディアFC</h2><div id="heroText" class="meta"></div></div><main><section id="home" class="section on"></section><section id="players" class="section"></section><section id="league" class="section"></section><section id="town" class="section"></section><section id="scout" class="section"></section><section id="more" class="section"></section></main><nav class="bottom" id="bottom"></nav></div><div class="modal" id="modal"><div class="profile" id="profile"></div></div><script>const KEY='hcm-v02',MY='札幌ノルディアFC',RIVAL='旭川ヴァルク',schedule=['青森ブリザード','千葉オルカ',RIVAL,'仙台レグルス','横浜セイラーズ','新潟アルビオン','東京クロノス','鹿児島サザンクロス','名古屋グランツ','福岡アトラス','神戸ハーバーズ','広島レッドアロー','大阪フェニックス'];const navs=[['home','🏠','ホーム'],['players','👥','編成'],['league','🏆','リーグ'],['town','🏙️','街'],['scout','🔎','発掘'],['more','☰','その他']];const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));let g=JSON.parse(localStorage.getItem(KEY)||'null');if(!g){alert('旧データが見つかりません。前バージョンを一度起動してください');throw 0}function hydrate(){g.formation=g.formation||'4-3-3';g.derbyHistory=g.derbyHistory||{w:0,d:0,l:0};g.players.forEach((p,i)=>{p.role=p.role||(p.starter?'starter':i<18?'bench':'out');p.starter=p.role==='starter';p.ab=p.ab||{shot:p.ovr,pass:p.ovr,dribble:p.ovr,defense:p.ovr,speed:p.ovr,physical:p.ovr,stamina:p.ovr,mental:p.ovr}});normalize()}function normalize(){let s=g.players.filter(p=>p.role==='starter');if(s.length>11)s.slice(11).forEach(p=>p.role='bench');if(s.length<11)g.players.filter(p=>p.role!=='starter').sort((a,b)=>b.ovr-a.ovr).slice(0,11-s.length).forEach(p=>p.role='starter');g.players.forEach(p=>p.starter=p.role==='starter')}hydrate();const save=()=>localStorage.setItem(KEY,JSON.stringify(g)),yen=n=>n>=1e8?(n/1e8).toFixed(1)+'億':Math.floor(n/1e4)+'万',opp=()=>schedule[(g.week-1)%schedule.length],row=n=>g.table.find(x=>x.n===n),ranking=()=>[...g.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)),starters=()=>g.players.filter(p=>p.role==='starter').slice(0,11);function teamPower(){let s=starters();return Math.round(s.reduce((a,p)=>a+p.ovr,0)/11)}function oppPower(n){let t=row(n);return Math.round(t?.power||65)}function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('on',x.id===id));render();scrollTo(0,0)}function render(){money.textContent=yen(g.money)+'円';fans.textContent=g.fans.toLocaleString()+'人';season.textContent=`S${g.season} W${g.week}`;let me=row(MY),o=opp(),tp=teamPower(),op=oppPower(o);heroText.textContent=`${me.w}勝 ${me.d}分 ${me.l}敗 ｜ チーム力 ${tp} ｜ ${g.formation}`;bottom.innerHTML=navs.map(x=>`<button data-id="${x[0]}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on',document.getElementById(x.dataset.id).classList.contains('on')));home.innerHTML=`<div class="card ${o===RIVAL?'derby':''}">${o===RIVAL?'<div class="derbyTitle">🔥 北海ダービー</div>':''}<div class="strength"><div><b>${MY}</b><div class="num ${tp>=op?'good':''}">${tp}</div></div><b>VS</b><div><b>${o}</b><div class="num ${op>tp?'bad':''}">${op}</div></div></div><div class="meta" style="text-align:center">チーム力差 ${tp-op>=0?'+':''}${tp-op}</div><div class="modes"><button class="action" onclick="startMatch('skip')">⏭ スキップ</button><button class="action" onclick="startMatch('watch')">👀 視聴</button><button class="action" onclick="startMatch('play')">🎮 プレイ</button></div></div><h3>クラブニュース</h3><div class="card log">${g.logs.slice(-7).reverse().join('<br>')}</div>`;players.innerHTML=squadHTML();league.innerHTML=`<h3>全国リーグ</h3><div class="card"><table class="table"><tr><th>#</th><th>クラブ</th><th>力</th><th>試</th><th>点</th></tr>${ranking().map((t,i)=>`<tr class="${t.n===MY?'me':t.n===RIVAL?'rival':''}"><td>${i+1}</td><td>${t.n}</td><td>${t.n===MY?teamPower():Math.round(t.power)}</td><td>${t.p}</td><td>${t.pts}</td></tr>`).join('')}</table></div>`;town.innerHTML=`<h3>ノルディアタウン</h3>${Object.entries({stadium:'🏟️ スタジアム',training:'🏋️ 練習場',academy:'🌱 アカデミー',station:'🚉 アクセス',shops:'🏪 商店街'}).map(([k,n])=>`<div class="card" style="margin-bottom:7px"><b>${n} Lv.${g.fac[k]}</b><button class="mini" style="float:right" onclick="upgrade('${k}')">改良</button></div>`).join('')}`;scout.innerHTML=`<h3>スカウト</h3><div class="card">既存のスカウト機能は次の更新で候補リスト式に強化予定。</div>`;more.innerHTML=`<h3>その他</h3><div class="card"><b>🔥 北海ダービー</b><p>${g.derbyHistory.w}勝 ${g.derbyHistory.d}分 ${g.derbyHistory.l}敗</p></div><div class="card" style="margin-top:9px"><b>⚙️ 開発者メニュー</b><p class="meta">ゲームバランス確認用。資金を好きなだけ追加できます。</p><div class="controls"><button class="mini" onclick="cash(1e8)">+1億</button><button class="mini" onclick="cash(10e8)">+10億</button><button class="mini" onclick="cash(100e8)">+100億</button></div><button class="action" style="width:100%;margin-top:7px" onclick="customCash()">金額を指定</button></div><div class="card" style="margin-top:9px"><b>セットプレー</b><p class="meta">FK・CK・PKキッカー設定は次段階で追加予定。</p></div>`}function squadHTML(){return`<h3>チーム編成</h3><div class="formation">${['4-3-3','4-4-2','3-4-2-1'].map(f=>`<button class="mini secondary ${g.formation===f?'on':''}" onclick="g.formation='${f}';save();render()">${f}</button>`).join('')}</div><div class="card"><div class="strength"><div><span class="meta">チーム総合</span><div class="num good">${teamPower()}</div></div><div>⚽</div><div><span class="meta">ベスト11平均</span><div class="num">${Math.round([...g.players].sort((a,b)=>b.ovr-a.ovr).slice(0,11).reduce((a,p)=>a+p.ovr,0)/11)}</div></div></div></div>${pitchHTML()}<div class="squadTabs"><button class="mini action" onclick="showGroup('starter')">スタメン</button><button class="mini secondary" onclick="showGroup('bench')">ベンチ</button><button class="mini secondary" onclick="showGroup('out')">ベンチ外</button></div><div id="squadList">${groupHTML('starter')}</div>`}function pitchHTML(){let s=starters(),pos=formationPositions(g.formation);return`<div class="pitch">${s.map((p,i)=>`<div class="spot" style="left:${pos[i][0]}%;top:${pos[i][1]}%"><div class="shirt">${p.ovr}</div><small>${p.n.split(' ')[0]}<br>${p.pos}</small></div>`).join('')}</div>`}function formationPositions(f){let map={'4-3-3':[[50,90],[15,70],[38,72],[62,72],[85,70],[25,48],[50,52],[75,48],[18,22],[50,17],[82,22]],'4-4-2':[[50,90],[15,70],[38,72],[62,72],[85,70],[15,47],[38,50],[62,50],[85,47],[35,20],[65,20]],'3-4-2-1':[[50,90],[25,70],[50,73],[75,70],[12,49],[38,52],[62,52],[88,49],[35,31],[65,31],[50,14]]};return map[f]||map['4-3-3']}function groupHTML(role){let title={starter:'スタメン',bench:'ベンチ',out:'ベンチ外'}[role];return`<h3>${title}</h3>`+g.players.filter(p=>p.role===role).sort((a,b)=>b.ovr-a.ovr).map(p=>`<div class="card player"><div><b>${p.n}</b><div class="meta">${p.pos} / ${p.age}歳</div></div><div><span class="ovr">${p.ovr}</span><select onchange="moveRole(${p.id},this.value)"><option value="starter" ${role==='starter'?'selected':''}>先発</option><option value="bench" ${role==='bench'?'selected':''}>ベンチ</option><option value="out" ${role==='out'?'selected':''}>外</option></select></div></div>`).join('')}function showGroup(role){squadList.innerHTML=groupHTML(role)}function moveRole(id,role){let p=g.players.find(x=>x.id===id);if(role==='starter'&&g.players.filter(x=>x.role==='starter').length>=11){alert('先発は11人。先に誰かをベンチへ移してください');render();return}p.role=role;p.starter=role==='starter';save();render()}function cash(n){g.money+=n;save();render()}function customCash(){let n=Number(prompt('追加する金額（円）','1000000000'));if(n>0){g.money+=n;save();render()}}function upgrade(k){let c=g.fac[k]*2e7;if(g.money<c)return alert('資金不足');g.money-=c;g.fac[k]++;save();render()}function startMatch(mode){let o=opp(),tp=teamPower(),op=oppPower(o),base=tp/(tp+op),us=0,them=0,events=[];for(let m=6;m<90;m+=r(5,11)){let our=Math.random()<base;if(Math.random()<.27){if(our){us++;events.push(`${m}' ⚽ ノルディア GOAL!`)}else{them++;events.push(`${m}' ⚽ ${o} GOAL`)}}else events.push(`${m}' ${our?'ノルディアが攻め込む':'相手の攻撃をブロック'}`)}if(mode==='skip'){finish(o,us,them);return}if(mode==='watch'){profile.innerHTML=`<div class="card"><h3>👀 試合視聴</h3><div class="match">${MY}<div class="score">${us} - ${them}</div>${o}</div><div class="commentary">${events.map(e=>`<div class="event ${e.includes('ノルディア GOAL')?'goal':''}">${e}</div>`).join('')}</div><button class="action" style="width:100%;margin-top:8px" onclick="finish('${o}',${us},${them})">試合終了</button></div>`;modal.classList.add('on');return}playMode(o,tp,op)}function playMode(o,tp,op){let us=0,them=0,min=0;profile.innerHTML=`<div class="card"><h3>🎮 PLAY MODE</h3><div class="meta">攻撃時に指示を選択。能力差と指示でチャンス率が変化します。</div><div class="match"><b id="liveMin">0'</b>　<span id="liveScore">0 - 0</span></div><div class="playfield" id="field"></div><div class="controls"><button class="action" onclick="playTurn('pass')">🔄 パス</button><button class="action" onclick="playTurn('dribble')">💨 ドリブル</button><button class="action" onclick="playTurn('shoot')">⚽ シュート</button></div><div id="liveLog" class="commentary" style="height:120px;margin-top:8px"></div></div>`;modal.classList.add('on');window.live={o,tp,op,us,them,min};drawField()}function drawField(){field.innerHTML='';for(let i=0;i<8;i++){let d=document.createElement('div');d.className='dot'+(i>3?' opp':'');d.style.left=(10+r(0,80))+'%';d.style.top=(10+r(0,80))+'%';d.textContent=i<4?'N':'R';field.appendChild(d)}let b=document.createElement('div');b.className='ball';b.style.left=(15+r(0,70))+'%';b.style.top=(15+r(0,70))+'%';b.textContent='⚽';field.appendChild(b)}function playTurn(a){let L=window.live;if(!L)return;L.min+=r(4,8);let bonus=a==='pass'?.08:a==='dribble'?.04:-.02,chance=L.tp/(L.tp+L.op)+bonus,txt='';if(a==='shoot'){if(Math.random()<chance*.38){L.us++;txt='⚽ GOAL!! シュートが決まった！'}else txt='シュート！…相手GKがセーブ'}else if(Math.random()<chance){txt=a==='pass'?'パスがつながる！':'ドリブル突破！'}else{txt='ボールを奪われた';if(Math.random()<.18){L.them++;txt+=' → カウンターから失点…'}}liveMin.textContent=Math.min(90,L.min)+"'";liveScore.textContent=L.us+' - '+L.them;liveLog.innerHTML=`<div class="event">${L.min}' ${txt}</div>`+liveLog.innerHTML;drawField();if(L.min>=90){liveLog.innerHTML=`<button class="action" style="width:100%" onclick="finish('${L.o}',${L.us},${L.them})">試合終了 →</button>`+liveLog.innerHTML;document.querySelectorAll('.controls button').forEach(b=>b.disabled=true)}}function result(t,a,b){t.p++;t.gf+=a;t.ga+=b;if(a>b){t.w++;t.pts+=3}else if(a===b){t.d++;t.pts++}else t.l++}function finish(o,us,them){let me=row(MY),ot=row(o);result(me,us,them);result(ot,them,us);g.table.filter(x=>x.n!==MY&&x.n!==o).forEach((t,i,arr)=>{if(i%2===0&&arr[i+1]){let a=r(0,3),b=r(0,3);result(t,a,b);result(arr[i+1],b,a)}});let derby=o===RIVAL;if(derby){if(us>them)g.derbyHistory.w++;else if(us===them)g.derbyHistory.d++;else g.derbyHistory.l++}let att=Math.min(g.fac.stadium*3000,Math.floor(g.fans*(derby?1.3:.75)));g.money+=att*2200;g.fans=Math.max(300,g.fans+(us>them?r(80,180):us===them?20:-15));g.logs.push(`${derby?'🔥 北海ダービー ':''}${o}戦 ${us}-${them}｜観客${att.toLocaleString()}人`);g.week++;if(g.week>26){g.season++;g.week=1;g.table.forEach((t,i)=>Object.assign(t,{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,power:(t.power||55)+r(0,3)}));g.players.forEach(p=>p.age++)}save();modal.classList.remove('on');render();go('home')}render();</script></body></html>
